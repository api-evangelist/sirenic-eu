  grade_basis: capabilities is an OBJECT (streaming, pushNotifications, extensions[]); protocolVersion is present
    at the top level ('0.3'); skills is an ARRAY of 116 fully-populated skills. All three optional discriminators
    (preferredTransport, defaultInputModes, defaultOutputModes) are present, and the card additionally carries the
