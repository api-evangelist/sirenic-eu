      (X-Api-Key srn_live_) is documented in the OpenAPI, not in the card.
  - field: skills
    observed: 116 skills whose ids are OpenAPI path templates
    note: The A2A surface is a 1:1 projection of the paid REST routes (116 of the 125 OpenAPI operations; the 9
      free/utility routes are not skills).
surface_relationship:
  note: Sirenic publishes REST (125 GET operations at https://api.sirenic.eu, OpenAPI at /openapi.json), a remote
    MCP server (POST https://api.sirenic.eu/mcp, streamable HTTP, manifest at /.well-known/mcp.json; OAuth connector
    variant at /mcp/connecteur) and this A2A agent (POST https://api.sirenic.eu/a2a). All three are projections
    of the same 116 paid routes and share the x402 / API-key payment rails; the api-catalog (RFC 9727) links every
    one of them.
