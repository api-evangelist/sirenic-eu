agent_card:
  name: Sirenic
  description: 'Pay-per-call French & European company data (official registers: INSEE Sirene, INPI RNE, NBB, Zefix
    and 8 more, plus worldwide entities via LEI/GLEIF). Every skill is a paid HTTP resource: send a JSON data part
    {"path": "/v1/..."} or {"skill": "<id>", "params": {...}}; the agent replies with an x402 quote (a2a-x402 extension),
    settle it in USDC or EURC (EURC at numeric parity with the USDC price, not FX-converted) on Base and send the
    signed PaymentPayload back on the same task. Paying in EURC requires an explicit client opt-in since @x402/core
    2.23 (spendControls.allowedAssets), otherwise your client silently keeps the USDC option. Set allowedAssets[].maxAmountPerPayment
    as well (integer ATOMIC amount, e.g. "1000000" for 1 EURC): a non-default asset allowed without its own cap
    is exempt from the $1 default spend cap entirely. Your x402 client also refuses, by default, any quote above
    $1.00 per payment (spendControls.maxAmountPerPayment); only GET /v1/kyb/batch (up to $10.50), GET /v1/surveillance/creer
    (up to $50.00), GET /v1/surveillance/:jeton/renouveler (up to $50.00) can exceed it at full size — each of those
    skills says so. No account, no API key. Free text is not interpreted.'
  version: 1.0.0
  url: https://api.sirenic.eu/a2a
  protocol_version: '0.3'
  preferred_transport: JSONRPC
  documentation_url: https://api.sirenic.eu/llms.txt
  icon_url: https://api.sirenic.eu/logo.png
  provider:
    url: https://api.sirenic.eu
    organization: Sirenic
  capabilities:
