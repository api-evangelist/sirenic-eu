  deviations:
  - field: protocolVersion
    observed: '''0.3'' at the top level while the SDK example and the A2A-Version header say 1.0'
    note: The card keeps the 0.3-era top-level triple (url/preferredTransport/protocolVersion) AND declares supportedInterfaces[];
      a 1.0 reader will use the latter, a 0.3 reader the former. Dual-shaped rather than out of spec.
  - field: capabilities.extensions[0]
    observed: https://github.com/google-a2a/a2a-x402/v0.1
    note: 'Every skill is a PAID resource: a first SendMessage returns an input-required task carrying an x402 quote
      in status.message.metadata["x402.payment.required"]; the signed PaymentPayload goes back on the same task.
      An agent without an x402-capable wallet (or an srn_live_ API key) cannot complete any skill.'
  - field: securitySchemes
