- name: Sirenic A2A Agent
  description: 'Agent2Agent JSON-RPC endpoint exposing the 116 paid routes as A2A skills (skill ids are the OpenAPI path templates) with the a2a-x402 v0.1 payment extension: a first SendMessage returns an input-required task carrying the x402 quote; the signed PaymentPayload goes back on the same task and the data arrives as a task artifact. Card served at /.well-known/agent-card.json (and the legacy /.well-known/agent.json), graded conformant.'
  humanURL: https://github.com/sirenic-eu/sirenic-examples/blob/main/examples/a2a.ts
  baseURL: https://api.sirenic.eu/a2a
