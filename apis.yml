- name: Sirenic MCP Server
  description: 'Remote Model Context Protocol server (streamable HTTP) over the same official French and European company-data routes: 77 tools such as search_french_companies, get_french_company_kyb_file, screen_sanctions_lists and prepare_french_invoice_file. Anonymous connect at /mcp — every tool returns an x402 quote until called with a signed payment or an srn_live_ API key; an OAuth 2.0 connector variant at /mcp/connecteur (authorization code + PKCE, dynamic client registration, scope mcp) bills the account''s free quota then prepaid credits.'
  humanURL: https://github.com/sirenic-eu/sirenic-examples/blob/main/examples/mcp-setup.md
  baseURL: https://api.sirenic.eu/mcp
  tags:
  - MCP
  - Company Data
  - KYB
  - x402
  properties:
