apis:
- name: Sirenic MCP Server
  description: >-
    Remote Model Context Protocol server (streamable HTTP) over the same official French and European
    company-data routes: 77 tools such as search_french_companies, get_french_company_kyb_file, screen_sanctions_lists
    and prepare_french_invoice_file. Anonymous connect at /mcp — every tool returns an x402 quote until
    called with a signed payment or an srn_live_ API key; an OAuth 2.0 connector variant at /mcp/connecteur
    (authorization code + PKCE, dynamic client registration, scope mcp) bills the account's free quota
    then prepaid credits.
  humanURL: https://github.com/sirenic-eu/sirenic-examples/blob/main/examples/mcp-setup.md
  baseURL: https://api.sirenic.eu/mcp
  tags:
  - MCP
  - Company Data
  - KYB
  - x402
  properties:
  - type: MCPServer
    url: mcp/sirenic-eu-mcp.yml
  - type: MCPManifest
    url: well-known/sirenic-eu-mcp.json
    name: /.well-known/mcp.json (verbatim)
  - type: ToolCrosswalk
    url: mcp/sirenic-eu-tool-crosswalk.yml
  - type: Documentation
    url: https://github.com/sirenic-eu/sirenic-examples/blob/main/examples/mcp-setup.md
- name: Sirenic A2A Agent
  description: >-
    Agent2Agent JSON-RPC endpoint exposing the 116 paid routes as A2A skills (skill ids are the OpenAPI
    path templates) with the a2a-x402 v0.1 payment extension: a first SendMessage returns an input-required
    task carrying the x402 quote; the signed PaymentPayload goes back on the same task and the data arrives
    as a task artifact. Card served at /.well-known/agent-card.json (and the legacy /.well-known/agent.json),
    graded conformant.
  humanURL: https://github.com/sirenic-eu/sirenic-examples/blob/main/examples/a2a.ts
  baseURL: https://api.sirenic.eu/a2a
  tags:
  - A2A
  - Agents
  - Company Data
  - x402
  properties:
  - type: AgentCard
    url: a2a/sirenic-eu-a2a.yml
  - type: AgentCard
    url: a2a/sirenic-eu-agent-card.json
    name: agent-card.json (verbatim)
  - type: Documentation
    url: https://github.com/sirenic-eu/sirenic-examples/blob/main/examples/a2a.ts
