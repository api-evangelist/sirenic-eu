access_model:
  default: No credential. Any /v1 GET without payment answers 402 with an x402 v2 quote (body + PAYMENT-REQUIRED
    header); the client signs it (USDC or EURC on Base, eip155:8453) and retries with PAYMENT-SIGNATURE. Non-2xx
    responses are never settled.
  api_key: 'X-Api-Key: srn_live_… or Authorization: Bearer srn_live_… — prepaid credits (1 credit = 1 EUR, packs
    10/20/50/100 EUR, valid 12 months, closest-to-expiry spent first). Response carries X-Credits-Charged and X-Credits-Remaining.
    Insufficient balance → 402 {error: credits_insuffisants} without an x402 quote. A signed x402 payment takes
    precedence over a key.'
  free_tier: '150 calls/month on routes priced ≤ $0.05 with a verified account (llms.txt / mcp.json). Free routes
    need nothing: /v1/suggestions, /v1/reperer, /v1/lecture, /v1/provenance/registres, /v1/demo/entreprise, /preview/…,
    /healthz.'
  account_gated: GET /v1/documents/{type}/{id} with type=actes requires an identified account (401 otherwise) since
    2026-09-19 — legal deeds carry personal data.
  key_storage: Keys and tokens are stored only as SHA-256 fingerprints; the customer area uses magic-link e-mail
    login, no password (privacy policy, Sécurité).
