relationships:
- from: Entreprise
  to: Etablissement
  type: has_many
  via: GET /v1/entreprise/{siren}/etablissements (siret startswith siren)
- from: Entreprise
  to: Dirigeant
  type: has_many
  via: dirigeants[] in /v1/entreprise/{siren}; reverse lookup GET /v1/dirigeant/recherche?nom=
- from: Entreprise
  to: Exercice
  type: has_many
  via: GET /v1/entreprise/{siren}/finances → exercices[] (date_cloture)
- from: Entreprise
  to: AnnonceBODACC
  type: has_many
  via: /alertes, /changements?depuis=, GET /v1/bodacc/recherche
- from: Entreprise
  to: Document
  type: has_many
  via: /documents → GET /v1/documents/{type}/{id}
- from: Entreprise
  to: MarchePublic
  type: has_many
  via: /marches-publics, /marches-publics-ue; buyer side GET /v1/acheteur/{siret}/profil
- from: Entreprise
  to: Group (LEI)
  type: belongs_to
  via: groupe_lei on every profile (GLEIF level-2 parents or declared reason for none)
- from: Entreprise
  to: Score defaillance
  type: has_one
  via: GET /v1/score/defaillance/{siren}; also embedded in /kyb, /comparer, /sante
- from: Entreprise
  to: Sector benchmark
  type: belongs_to
  via: activite_principale → GET /v1/secteur/{code_naf}/benchmarks
- from: KYB dossier
  to: Entreprise
  type: composes
  via: GET /v1/kyb/{siren} = identite + dirigeants + alertes_bodacc + finances + criblage_sanctions + tva; GET /v1/entreprise/{siren}/dossier?blocs=
    picks blocks
- from: Surveillance
  to: Entreprise | Dirigeant | Association
  type: has_many (targets)
  via: cibles= at creation (SIREN, RNA, dirigeant:Name)
- from: Surveillance
  to: Evenement
  type: has_many
  via: GET /v1/surveillance/{jeton} (last 100) and signed webhook batches
- from: Association
  to: AnnonceJOAFE
  type: has_many
  via: GET /v1/association/{rna}/annonces
- from: EntrepriseEU
  to: ComptesEU
  type: has_many
  via: /v1/eu/entreprise/{pays}/{id}/comptes → /comptes/{reference|date_cloture}
- from: EntrepriseEU
  to: DirigeantEU | EvenementEU | InsolvabiliteEU | Etablissement
  type: has_many
  via: country sub-routes (NO, GB, LV, EE, HR, RO, CH, FI, CY, DK, CZ, PL, LT, IE)
- from: Every paid response
  to: Provenance block
  type: has_many
  via: provenance[] (source_code, licence, version, as_of, precision_as_of, etat, couverture, confiance) — codes
    resolved at GET /v1/provenance/registres
response_envelope:
  common_fields:
  - source
  - disclaimer
  - data_freshness
  - provenance[]
  note: Ed25519-signed bodies; see conventions/sirenic-eu-conventions.yml
