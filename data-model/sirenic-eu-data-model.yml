generated: '2026-09-19'
method: derived
source: openapi/sirenic-eu-openapi.yml path hierarchy and response examples (components.schemas is EMPTY in the
  provider spec, so there are no $ref links to walk; relationships are read from path parameters and the example
  bodies), llms.txt "What you get back", examples/responses/*.json in sirenic-eu/sirenic-examples.
identifiers:
- entity: Entreprise (FR)
  id: siren
  format: 9 digits, Luhn
  example: '552032534'
- entity: Etablissement (FR)
  id: siret
  format: 14 digits = siren + 5-digit NIC
  example: '55203253400703'
- entity: Association (FR)
  id: rna
  format: W + 9 digits
- entity: European company
  id: pays + national id
  format: ISO 3166-1 alpha-2 + registry number (BE id, CH id, GB company_number, NO id, EE registrikood, LV regnr,
    LT kodas, HR oib, CZ/SK ico, PL krs/nip, RO cui, IE numero, CY id, SE orgnr, DK cvr, ES hoja/nif, PT nipc)
- entity: Group
  id: lei
  format: ISO 17442, 20 chars (GLEIF)
- entity: Watchlist
  id: jeton
  format: sw_<uuid>.<timestamp>.<Ed25519 sig>
- entity: Document
  id: type + id
  format: type ∈ {actes, bilans}; id from /v1/entreprise/{siren}/documents
- entity: Sector
  id: code_naf
  format: NAF/APE code
- entity: Public buyer
  id: siret
