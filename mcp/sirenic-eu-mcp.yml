  Belgium since 1 January 2026; Poland''s White List account check). Plus French & European company data
  for AI agents: France in depth (INSEE Sirene / INPI RNE) with profiles, officers, financials, share
  capital, default scoring, sanctions screening and documents; European search & profiles (Belgium, Switzerland,
  UK, Norway, Estonia, Latvia, Czechia, Slovakia, Finland, Poland), Spanish registry acts (BORME) and
  worldwide entities via LEI/GLEIF. Paid per call in USDC or EURC via the x402 protocol. Start for free:
