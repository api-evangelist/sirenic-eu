tools:
- name: search_french_companies
  description: 'Use FIRST whenever a French company is mentioned by NAME without an identifier. French
    company search and company lookup by name or SIREN in the official French company registry (INSEE
    Sirene / INPI RNE data). Returns the top 10 matches, each with a score_confiance (0-1 match confidence,
    helps pick among homonyms); total_results counts every match (tronque: true beyond the 10 served,
    note_troncature when it is a lower bound). Order: match level first (0: the name, the official name
    in the French search, equals q once the legal forms written for the result''s country are removed
    at either end of both, never the last word, for the countries of the closed list of written legal
    forms, a GLEIF result from any other country keeping its whole name; 1: every remaining word of q
    is a word of the name; 2: similar only), then an internal ranking score, not score_confiance (European
    search: score_confiance before its cap at 1 and its rounding; French search: the similarity of the
    name, usual name and acronym, plus 0.05 for an active company, the name and acronym only in the real-time
    fallback); ties: by SIREN in the French search, one country in turn in the European search (rank by
    national ID within each country, then country code). etages_abandonnes is always present: an empty
    array means the top 10 is complete; a non-empty one (with resultats_partiels: true) means the local
    index was degraded and the real-time fallback failed, so the list is partial: retry in a few seconds.
    If aucune_correspondance_fiable is true, no result resembles the name you asked for (best confidence
    < 0.5): do NOT treat the top hit as the company; check the spelling or retry. In the local index,
    typo tolerance only covers active companies under full disclosure: a ceased company, or one under
    partial disclosure, is found there by its exact name, its beginning or all its words. Paid via x402
    ($0.002 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
  category: search
  rest: /v1/recherche
- name: get_french_company_profile
  description: 'Full official company profile of a French company by SIREN, from the French company registry
    (INSEE Sirene / INPI RNE): legal name, legal form, head office, NAF code, workforce, officers, collective
    agreements (conventions_collectives, with conventions_collectives_notes reading out technical IDCC
    codes: 9999 means no collective agreement is assigned, it is not an agreement number to look up),
    VAT number, plus groupe_lei for LEI holders: the GLEIF level-2 group, direct and ultimate CONSOLIDATING
    parents (named, except a parent that GLEIF flags as a natural person or of an ambiguous legal form:
    mere_omise gives the reason, no name, no LEI; non_servie, a neutral value, when another reason leaves
    it out) or the declared reason for having none (accounting consolidation, never capital ownership
    or beneficial owners; sans_objet without a LEI). The core company data lookup for KYB and due diligence
    on France. An identity whose administrative status or legal category is missing in Sirene is served
    with blocs_absents (raison identite_incomplete) and a partial provenance. Paid via x402 ($0.005 in
    USDC or EURC). When you report a result, cite its `citation` verbatim.'
  category: lookup
  rest: /v1/entreprise/{siren}
- name: list_french_company_establishments
  description: List all establishments (SIRET) of a French company — branches and addresses with open/closed
    status, from the official French company registry. Paid via x402 ($0.003 in USDC or EURC). When you
    report a result, cite its `citation` verbatim.
- name: prepare_french_einvoicing_recipient
  description: 'Use when you need to PREPARE a compliant French e-invoice for a company (invoice header,
    VAT number, addressing) rather than decide whether paying it is safe — for the full verify-the-supplier-before-payment
    verdict, IBAN included, call prepare_french_invoice_file. The French e-invoicing mandate applies from
    1 September 2026: receiving becomes obligatory for every VAT-liable company on that date, issuing
    is phased (large and mid-sized companies 1 September 2026, SMEs and micro-enterprises 1 September
    2027; art. 91 of the 2024 Finance Act). Returns legal name & form, active/ceased status, computed
    intra-EU VAT number (+ VIES-check pointer), establishments (SIRET) with addresses, NAF code and indicative
    send/receive obligation dates from the INSEE size category. The response is Ed25519-signed and carries
    provenance[] — one entry per block served, with the official register, its licence and its as_of date
    — so the preparation is auditable offline. Preparation only — Sirenic is not an accredited platform
    (PDP), does not access the central directory and never issues, transmits or routes invoices, nor confirms
    PPF/PDP registration. Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation`
    verbatim.'
- name: get_french_company_default_risk
  description: 'Company default-risk score (0-100) for a French company at ~12 months — credit risk and
    insolvency risk scoring from filed financial ratios (structure, profitability, liquidity, net cash,
    debt service, trend) + company age + a hard BODACC override (active insolvency / liquidation / closure
    for insufficiency of assets = proven default). Returns score, qualitative band, every component with
    its threshold, and a confidence level. Decision-support only — NOT a solvency opinion or credit rating.
    `couverture_axes` names the axes the scale could evaluate and the silent ones with a closed-list reason
    (no published ratio, holding lens, single-year trend, uncovered line items, commercial-court decisions
    not read): a silent axis cannot penalise, so fewer computed axes means possibly understated risk,
    never a better score. Commercial-court decisions linked to the company are read as an INERT axis (zero
    points) and counted in `contentieux_informatif` (by nature and role, partial coverage: zero never
    means no litigation). `echelle.backtest` carries the dated measurement of the scale on real French
    defaults (BODACC opening judgments 2024-2025 joined with filed accounts, case-control design): AUC,
    share of defaults per band with confidence intervals, detection at the 25 and 50 thresholds. These
    are OBSERVED rates on a sample, never a probability of default for the company you are reading; `versions_couvertes`
    names the scale versions the measurement holds for. Paid via x402 ($0.10 in USDC or EURC). When you
    report a result, cite its `citation` verbatim.'
  category: risk
  rest: /v1/score/defaillance/{siren}
- name: get_french_company_default_risk_batch
  description: 'Use when asked to rank customers or suppliers by default risk, e.g. "Rank my customers
    by risk and monitor the 30 most exposed." Batch default-risk score for 2 to 100 French companies in
    one call: each line carries the SAME score, class, confidence and model version as get_french_company_default_risk
    (one scorecard), in a closed-list basket: expose, a_surveiller, sain, non_evaluable (with its cause),
    cessee (a ceased company always goes there, whatever its class). Lines are ordered by basket, then
    by exact axis set (jeu_axes, index into jeux_axes: two scores computed on different axes are never
    ranked against each other), then by score; motifs_principaux names the at most three scorecard axes
    that weigh most; a line whose reference year is not exploitable carries qualite_exercice_reference
    (fiabilite, anomalies): read it before the score. The head counts the non_evaluable lines per cause
    (non_evaluable_par_cause). An unknown SIREN is a billed line (trouve=false, cause siren_inconnu),
    and so is one whose identity is incomplete (cause identite_incomplete, with champs_absents and fiche);
    no line scored at all: 404, not charged, lignes naming each cause (error identite_incomplete when
    every SIREN is incomplete); BODACC down: the whole batch is cancelled (503), not charged. No officer,
    no free text; the name only for a legal entity. chainage.surveillance lists the WHOLE expose basket
    in served order (axis set, then score; 100 at most, never a ceased company) with the 30-day quote
    of create_surveillance_watch for that list: $0.05 per target x targets. To monitor the first N only,
    pass its first N SIRENs to create_surveillance_watch (quoted N x $0.05): a separate watch, paid on
    its own, checked daily, never real time. Paid via x402 ($0.07 per SIREN in USDC or EURC, 30% off the
    unit score). Closed lists and reading rules: GET /v1/lecture (free). A full-size request quotes up
    to $7.00, above the $1.00 single-payment cap that x402 clients apply BY DEFAULT since @x402/core 2.23
    (spendControls): raise spendControls.maxAmountPerPayment, or set spendControls: false, before signing;
    otherwise your own client rejects the quote without ever calling us. When you report a result, cite
    its `citation` verbatim.'
- name: get_french_sector_benchmarks
  description: 'Sector benchmarks and sector statistics for a French NAF activity code (any level: 68,
    68.2, 68.20, 68.20B): number of active companies, median company age (+quartiles), workforce-bracket
    distribution, and — when at least 5 companies file public accounts — median revenue, EBITDA margin,
    pre-tax result and debt ratio. Peer comparison: place a company against its peers. Aggregates only,
    no personal data. Paid via x402 ($0.05 in USDC or EURC). When you report a result, cite its `citation`
    verbatim.'
  category: risk
  rest: /v1/secteur/{code_naf}/benchmarks
- name: get_french_company_capital
  description: 'Ownership / share capital structure of a French company, extracted by AI from the latest
    PUBLIC articles of association filed at the INPI registry: share capital, legal form, shareholders
    — CORPORATE holders named with role and ownership %, natural persons COUNTED with their % and never
    named since 2026-09-19 (associes_personnes_physiques, detenu_par_personnes_physiques_pct; GDPR, CJEU
    C-798/24) — notable clauses, with confidence and the source document. Reconstructed from public filed
    deeds — NOT a beneficial-ownership register (RBE) or a beneficial-owner identification. Paid via x402
    ($0.35 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
  category: ownership
  rest: /v1/entreprise/{siren}/capital
- name: get_french_company_intellectual_property
  description: 'Intellectual-property portfolio of a French company from INPI open data: trademarks, patents
    and designs filed (counts + items with number, title, status, ISO dates and classification; trademarks
    also carry registration and expiry dates). Every date states what it is in date_nature, and every
    block its ordering in liste_ordre — trademarks and designs date-descending, patents NOT sorted upstream.
    An R&D/brand-value signal. Patent inventor names (natural persons) are never returned. Paid via x402
    ($0.03 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
  category: ip
  rest: /v1/entreprise/{siren}/pi
- name: get_french_company_changes
  description: 'Company monitoring for France: new official BODACC gazette announcements for a French
    company SINCE a given date (poll-mode watchlist surveillance for a portfolio) — insolvency, deregistration,
    sales, filings, changes, reverse-chronological. Detects new BODACC publications, not field-level edits
    of the profile. A company with no new announcement returns an empty list. Judgments in closed fields
    (category, appointed officers by role and form, date of cessation of payments), never the judgment''s
    text nor a natural person''s name; withheld labels are counted in `omissions`. Paid via x402 ($0.01
    in USDC or EURC). When you report a result, cite its `citation` verbatim.'
  category: monitoring
  rest: /v1/entreprise/{siren}/changements
- name: get_french_company_updates_since
  description: 'What changed at a French company since a date ("what changed at this customer since June?"):
    every official block in one call, namely BODACC notices (insolvency, sales, deregistration, changes,
    accounts filings with their figures), commercial-court decisions, French and EU public contracts,
    establishments opened or closed, cessation, licences, dated sanctions listings, trademarks, patents
    and designs, RGE certifications and the lobbying register. Each change is dated at publication with
    the event date alongside; verdict nouveautes, rien_de_nouveau (every block read in full and fresh)
    or lecture_incomplete (a block down, stale or partly read, named); monthly stocks (Sirene, French
    contracts) make a recent date, after their snapshot, yield lecture_incomplete, never rien_de_nouveau;
    the 100 most recent, per-type totals before the cut. Hiring, officers and headcount band are outside
    the engine. Paid via x402 ($0.05 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: search_french_company_directors
  description: 'Reverse search for company directors and officers in France — a people search by surname:
    list the French companies where a person of a given surname holds (or held) an office, with the company
    SIREN, name and the person''s role — for due diligence and network mapping. Person data limited to
    surname, first names, role and birth year. Homonyms are not disambiguated; common names are capped.
    Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
  category: people
  rest: /v1/dirigeant/recherche
- name: get_french_company_legal_alerts
  description: 'Legal alerts and legal notices for a French company from BODACC, the official French gazette:
    insolvency proceedings (procedures collectives), court filings, deregistrations, business sales —
    grouped, most recent first. Judgments in closed fields (category, appointed officers by role and form,
    date of cessation of payments), never the judgment''s text nor a natural person''s name; withheld
    labels are counted in `omissions`. Paid via x402 ($0.01 in USDC or EURC). When you report a result,
    cite its `citation` verbatim.'
  category: compliance
  rest: /v1/entreprise/{siren}/alertes
- name: get_french_company_briefing
  description: 'LLM-ready briefing on a French company (SIREN), returned as Markdown text to read or paste
    as is: identity without officers, filed accounts over three years with their reliability, BODACC insolvency
    notices, commercial-court decisions and public contracts counted and dated, each block with its status,
    age and coverage. Written by code from official registers, no model text; legal entities only (a sole
    proprietorship answers 400, never charged). The text opens with its instruction and ends with its
    source line: copy it verbatim. Paid via x402 ($0.05 in USDC or EURC).'
- name: get_french_company_court_decisions
  description: 'Commercial-court decisions linked to a French company (SIREN) from the Cour de cassation
    open data (Judilibre): counts, closed-list nature (insolvency judgment, order or judgment to pay,
    summary proceedings, expert appraisal, other dispute), the company''s role (claimant, defendant),
    the other companies involved (SIREN only) and the official link to each decision. No text, no individual''s
    name, no amount: read the decision at the source. Coverage is partial and measured (about 62% of decisions
    carry a usable identifier) — no result never means no litigation; insolvency judgments are also served
    by get_french_company_legal_alerts. A sole proprietorship, a restricted-diffusion entity or a group
    without legal personality (INSEE category 2xxx, such as a joint ownership between natural persons,
    or 9210) answers 400 with its exact code and is never charged. Paid via x402 ($0.01 in USDC or EURC).
    When you report a result, cite its `citation` verbatim.'
- name: get_french_company_collective_agreements
  description: 'Company-level collective agreements of a French company (SIREN) published on Légifrance
    (ACCO fund, mandatory publication since 2017-09-01): title, nature (accord / avenant), DILA themes
    (pay, working time, telework, gender equality, profit-sharing…), signature, effect and end dates,
    collective-agreement code (IDCC) checked against Sirene, signatory unions and the official Légifrance
    link — metadata only, never the text nor a person''s name. Searched by filing SIRET over the establishments
    known to Sirene (25 at most, the rest counted): an empty list never means « no social dialogue » (headcount
    threshold, unpublished decisions). A sole proprietorship, a restricted-diffusion entity or a group
    without legal personality (INSEE category 2xxx or 9210) answers 400 with its exact code and is never
    charged. Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_french_company_financials
  description: 'Annual accounts and financial statements data of a French company from filed accounts
    (revenue, EBITDA, net income, ratios: INPI/Banque de France), plus the full structured tax-form line
    items (liasse fiscale) from the INPI registry, for up to the 20 latest public balance sheets. Every
    fiscal year carries a `qualite` grade (exploitable / a_verifier / non_exploitable, with anomaly codes
    and doubtful fields): read it before trusting an amount; rows the source published twice or that are
    demonstrably wrong are served under `exercices_ecartes`, never silently dropped. Consolidated accounts
    come apart, graded the same way. Carries decalage_analytique: the latest statement filed at the register
    (INPI, live) vs the latest year in the ratio dataset, with a closed-list reason: the dataset lags
    filings by months, so the newest filing may be served raw in bilans_saisis_inpi while ratios, trends
    and scores still rest on the previous year. `interpretabilite` says whether revenue-based ratios measure
    this entity''s activity: for a holding or head office (NAF 64.20 / 70.10) they are computable but
    economically limited: income comes from financial products booked after EBITDA. Since 2026-09-06 each
    statutory fiscal year repeats that flag next to the ratios it concerns (`exercices[].ratios_interpretabilite.<ratio>
    = limitee`), so a reader of the ratios alone is warned; `decalage_analytique.decalage` is the machine-readable
    lag flag (true when a newer filing than the analysed year is known). Paid via x402 ($0.01 in USDC
    or EURC). When you report a result, cite its `citation` verbatim.'
  category: financials
  rest: /v1/entreprise/{siren}/finances
- name: get_french_company_public_procurement
  description: 'Public procurement in France: government contracts and tenders won by a French company
    (official DECP data) — buyers, amounts, dates, lot number when the subject states one, joint-holder
    count, and how to READ the amount: modalitesExecution tells whether it is a firm price or an ENVELOPE
    (call-off orders, subsequent contracts, optional tranches — 43% of contracts), and declared subcontracting
    with its amount tells what the holder does not keep. An amount covers the whole awarded contract or
    LOT over its full duration, excl. VAT; on a framework agreement it is a MAXIMUM CEILING, not spend
    (the total is split into ceilings vs firm commitments). Also CCAG, price type, advance and its rate,
    EU/French content ratios, amendment rank and dates, and the platform that published the record. Totals
    come as TWO BOUNDS: nombre_marches/montant_total count every published row (upper bound), nombre_marches_dedoublonne/montant_total_dedoublonne
    count one row per (buyer, notification date, amount, CPV) key (lower bound) — the same award is often
    published twice (two platforms, two establishments of the holder, repeated row, amendment); each row
    carries publication.statut (closed list) and its linked rows, and identifiant_partage flags a buyer
    id reused for distinct purchases. Paid via x402 ($0.01 in USDC or EURC). When you report a result,
    cite its `citation` verbatim.'
  category: procurement
  rest: /v1/entreprise/{siren}/marches-publics
- name: find_expiring_french_public_contracts
  description: 'Tender anticipation for France: public contracts EXPIRING within a window (1-24 months,
    default 12): it surfaces opportunities BEFORE any notice is published. Filter by CPV prefix (45 =
    construction, 9091 = cleaning) and department. Returns buyer, incumbent holders, amounts, lot number
    when stated, whether the amount is a firm price or an ENVELOPE (call-off orders, subsequent contracts,
    optional tranches), declared subcontracting, framework-agreement flag (its amount is a MAXIMUM CEILING
    over the duration, not spend), estimated end dates (date_fin_estimee: notification + declared duration,
    amended where the historical DECP regime publishes it; duree_mois is the initial duration). From official
    DECP open data. Paid via x402 ($0.05 in USDC or EURC). When you report a result, cite its `citation`
    verbatim.'
  category: procurement
  rest: /v1/marches/expirations
- name: get_french_public_buyer_profile
  description: 'Procurement profile of a French public buyer (by SIRET): contract volumes by year, top
    CPV segments, incumbent suppliers with their contracts expiring within 18 months, framework-agreement
    share, share of amounts that are envelopes rather than firm prices, share of contracts with declared
    subcontracting, share granting an advance, dominant CCAG and price type, publishing platform, average
    bids received per tender and median publication delay: the buying habits to know before a sourcing
    meeting. From official DECP open data. Paid via x402 ($0.02 in USDC or EURC). When you report a result,
    cite its `citation` verbatim.'
  category: procurement
  rest: /v1/acheteur/{siret}/profil
- name: get_company_procurement_competitors
  description: 'Competitive intelligence on French public procurement: who wins contracts on the SAME
    CPV segments as a given company (SIREN): top rival contractors over the last 3 years with counts,
    amounts and shared segments. From official DECP open data. Paid via x402 ($0.02 in USDC or EURC).
    When you report a result, cite its `citation` verbatim.'
- name: search_european_companies
  description: 'European company search: company lookup by name across official European company registers,
    in one unified schema. Local copies, all searched when pays is absent: Belgium, Croatia, Cyprus, Estonia,
    Ireland, Latvia, Lithuania, Norway, Romania, Sweden, Spain (BORME base, hoja key); live, only with
    pays set: Czechia, Finland, Slovakia, Switzerland; Poland through GLEIF (no name search at the register);
    Denmark and the United Kingdom live, only with pays set; plus worldwide GLEIF (LEI) coverage. Each
    match carries a score_confiance (0-1 match confidence). Order: match level first (0: the name, the
    official name in the French search, equals q once the legal forms written for the result''s country
    are removed at either end of both, never the last word, for the countries of the closed list of written
    legal forms, a GLEIF result from any other country keeping its whole name; 1: every remaining word
    of q is a word of the name; 2: similar only), then an internal ranking score, not score_confiance
    (European search: score_confiance before its cap at 1 and its rounding; French search: the similarity
    of the name, usual name and acronym, plus 0.05 for an active company, the name and acronym only in
    the real-time fallback); ties: by SIREN in the French search, one country in turn in the European
    search (rank by national ID within each country, then country code). nombre_resultats counts every
    servable result the registers returned (tronque: true beyond the 10 served, note_troncature when it
    is a lower bound). Czechia, Estonia, Norway, Latvia and Slovakia serve legal persons only: a sole
    trader (in Estonia, a sole proprietorship, FIE; in Norway, a sole proprietorship, ENK, a registered
    individual or an estate; in Latvia, an individual merchant, IK, or an individual, family, farm or
    fishery enterprise; in Slovakia, any entity of the trade register, and one of the commercial register)
    or a form not recognised as a legal person is left out; Croatia too (a trgovac pojedinac, t.p., or
    an undecided form); in Denmark, a sole proprietorship (ENK), a personally owned small business (PMV),
    an estate (DØD) or an undecided CVR form; in Lithuania, an individual enterprise (individuali įmonė,
