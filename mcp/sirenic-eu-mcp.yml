    totals (`nombre_attributions`, `valeur_totale_eur`, `nombre_avis_emis`) and `stock` (first and last
    day collected). Natural-person winners are never served, nor a buyer that is an individual merchant;
    `ecartes.personne_physique` (only when non-zero) counts the winners kept without identity among the
    awards of the listed notices. About 3% of Latvian winners are published without an identifier and
    the stock starts on 2023-10-25: `aucune_attribution: true` is a NON-conclusive absence. Facts only,
    no score. Legal persons only: an individual merchant (IK), a sole trader or a form not recognised
    as a legal person returns 404, not billed. Paid via x402 ($0.02 in USDC or EURC). When you report
    a result, cite its `citation` verbatim.'
- name: get_croatian_company_insolvency
  description: 'Croatian company insolvency status from the official Sudski registar (court register,
    daily snapshot of the open API, Otvorena dozvola): running procedure (bankruptcy or stečaj, liquidation,
    pre-bankruptcy stages, bankruptcy or liquidation estate) and every published court decision with its
    extracted facts (court, case reference, date), never the decision text. `aucune_procedure: true` is
    a measured fact on the complete snapshot. Unknown OIB/MBS = 404 (deleted subjects are not published
    by the API). A sole trader (trgovac pojedinac, t.p.) or an undecided legal form returns 404, not billed;
    so does a name covered by an objection. Paid via x402 ($0.02 in USDC or EURC). When you report a result,
    cite its `citation` verbatim.'
- name: get_croatian_company_events
  description: 'Croatian company statutory entries from the official Sudski registar (daily snapshot):
    every typed entry in register order (108 types: founding act, statute, legal form, capital changes,
    mergers and divisions, enterprise contracts, dissolution grounds, court decisions). The published
    text is served only for a closed list of entry types without natural persons (`texte_retenu: true`
    otherwise); court decisions come as court, reference and date. A sole trader (trgovac pojedinac, t.p.)
    or an undecided legal form returns 404, not billed; so does a name covered by an objection. Paid via
    x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_croatian_company_accounts
  description: 'Croatian company annual-accounts filings recorded at the Sudski registar (daily snapshot):
    per financial year, the filing type (GFI-POD report, statement of inactivity, statement of correction),
    consolidation flag, period covered and filing date, newest first; metadata only, never the document.
    `aucun_depot: true` is a measured fact. A sole trader (trgovac pojedinac, t.p.) or an undecided legal
    form returns 404, not billed; so does a name covered by an objection. Paid via x402 ($0.01 in USDC
    or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_swiss_company_events
  description: 'Swiss company commercial-register publications from the Swiss Official Gazette of Commerce
    (SOGC/SHAB, SECO, public API, live with a 24 h cache, online since July 2018): every registration,
    change and deletion carrying the company''s UID, newest first: date, publication number, canton, office,
    the company as published (name, UID, seat, eCH legal-form code, purpose, capital, address without
    the c/o line) before and after the change, and closed-list change flags (name, seat, address, purpose,
    capital, legal form, bankruptcy, liquidation, suspension, re-entry, other entries). The published
    free text is withheld (`texte_retenu: true`): it names persons. Beyond 60 listed publications they
    are detailed newest first until 60 servable ones are found (200 more details at most), and `troncature`
    says when some are not. A publication whose company is a sole proprietorship (before or after the
    change) is left out and counted in `ecartes`. Unknown UID, sole proprietorship (Einzelunternehmen),
    branch without a served head office or undecided legal form = 404 (no charge), as for the profile.
    Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_swiss_company_insolvency
  description: 'Swiss company bankruptcy publications from the SOGC/SHAB (SECO, public API, live, 24 h
    cache, online since 2021): every publication whose debtor is the company (natural persons never served),
    newest first: preliminary bankruptcy notice, bankruptcy publication and call to creditors, suspension,
    schedule of claims and inventory, distribution list, closing, revocation, real-estate auction, recognition
    of a foreign bankruptcy, with decision date, deadlines, office, canton and the official labels in
    DE/FR/IT/EN. `aucune_procedure: true` is a fact bounded by the online archive for a company known
    to Zefix; bankruptcy and liquidation flags recorded in the register itself come with get_swiss_company_events.
    Unknown UID, sole proprietorship (Einzelunternehmen), branch without a served head office or undecided
    legal form = 404 (no charge), as for the profile. Paid via x402 ($0.02 in USDC or EURC). When you
    report a result, cite its `citation` verbatim.'
- name: get_finnish_company_events
  description: 'Finnish company trade-register notices from the PRH open data (avoindata.prh.fi, CC BY
    4.0, live with a 24 h cache): every notice registered since late 2014, newest first: date, record
    number, notice type (creation, modification, comptes_annuels, rectification, fusion; source code always
    served) and the register entry codes it carries, each with the PRH labels in EN/FI/SV and a closed-list
    family (direction, representation, capital, shares, registered office, auditors, articles, bankruptcy,
    restructuring, liquidation, removal, merger, demerger…); `procedures_inscrites` summarises bankruptcy
    / restructuring / liquidation / removal codes with their latest date; register memberships (trade
    register, VAT, prepayment, employer) with dates and `tva_active`. Codes and dates only, never a person.
    Unknown Business ID, a foreign trader''s branch or a form outside the YRMU codebook = 404 (no charge).
    Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_romanian_company_officers
  description: 'Romanian company legal representatives from the ONRC open data (data.gov.ro, CC BY 4.0,
    monthly national snapshot): every mandate published for every registration of the CUI — administrators,
    permanent representatives of corporate administrators, general director, supervisory board and directorate
    members, liquidators, judicial and special administrators — with the register''s Romanian label, a
    closed-list family (role.famille) and the nature (natural person or entity, inferred from the presence
    of a birth date); sorted by family then name, duplicates across re-registrations merged; `aucun_mandat_publie`
    is measured on the complete snapshot. Name and role only: birth date, birthplace and domicile published
    by the source are never stored. Legal persons only (sole traders and family enterprises are refused
    404). 503 fail-closed when the monthly snapshot is missing or older than 70 days. Paid via x402 ($0.01).
    When you report a result, cite its `citation` verbatim.'
- name: get_romanian_company_insolvency
  description: 'Romanian company insolvency from the ONRC register open data (data.gov.ro, CC BY 4.0,
    monthly national snapshot): the register status codes of the bankruptcy (faliment), insolvency (Law
    85/2014, Law 85/2006, Law 64/1995, judicial reorganisation, financial recovery), liquidation and dissolution
    families with their published Romanian labels and a closed family, plus the insolvency practitioners
    published among the legal representatives (judicial liquidator, judicial administrator, special or
    concordat administrator, liquidator — name and capacity only); `aucune_procedure` = no such status
    AND no practitioner, measured on the complete snapshot for a known CUI; statuses are undated and court
    decisions are not published, so a closed proceeding may remain recorded (`autres_statuts` carries
    the other register entries). Legal persons only. 503 fail-closed when the snapshot is missing or older
    than 70 days. Paid via x402 ($0.02). When you report a result, cite its `citation` verbatim.'
- name: get_romanian_company_accounts
  description: 'Romanian company annual accounts from the Ministry of Finance open data (data.gov.ro,
    CC BY 4.0, financial years 2019-2024, every published year in one call): balance sheet (fixed and
    current assets, inventories, receivables, cash, liabilities, provisions, equity, paid-up capital),
    income statement (net turnover, total income and expenses, gross and net profit or loss), average
    headcount, CAEN Rev. 2 activity class and filing format (abridged or full). Amounts in RON as published,
    null = not published, never zero. Legal persons only; a company with no published statement answers
    404 without charge (banks, insurers, NBFIs and NGOs file in separate, unserved files). Paid via x402
    ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_portuguese_company_public_procurement
  description: 'Public-procurement record of a Portuguese company from IMPIC''s Portal BASE (weekly open-data
    files on dados.gov.pt, public domain; every public contract since 2012): contracts WON by NIPC (buyer,
    subject, procedure and contract type in closed lists, CPV, lots, contract/base/final prices in EUR,
    dates, duration, framework agreement, closure, bidder count, contract modifications), contracts ISSUED
    as a buyer, notices in the Diário da República; newest first, capped at 100. Winners and bidders published
    without a NIF are never named, only counted; a party whose NIF starts with 7 or 9 (estate, fund, condominium,
    partnership without legal personality, non-resident) is neither named nor identified, counted in `ecartes`.
    400 without charge for a natural-person NIF or an invalid check digit; 404 without charge for a 7
    or 9 NIF (forme_juridique_non_servie) or when nothing is found (absence is not conclusive). Price
    $0.02. When you report a result, cite its `citation` verbatim.'
- name: get_polish_company_public_procurement
  description: 'Public-procurement record of a Polish company from the Biuletyn Zamówień Publicznych (e-Zamówienia
    public API, UZP, CC0; national below-EU-threshold notices since 2021, daily updates): contracts WON
    matched by legal-person NIP (`attributions`, one per awarded part: buyer with NIP, subject, CPV, closed-list
    outcome, tenders received, awarded price and contract value in PLN as published, contract date, declared
    enterprise size) and notices ISSUED as a buyer (`avis_emis`); newest first, capped at 100 with `tronque_*`.
    Winners are served only when PROVEN legal persons (legal form in the name or KRS from the VAT white
    list): sole traders (37 % of winners) are never served (400 without charge), a NIP not yet classified
    answers 404 without charge (`stock.gagnants_a_classer`), and so does a source placeholder NIP (`identifiant_bouche_trou`).
    A dubious published value (contract date out of bounds or after its notice, a winner name carrying
    an address) is served as published with a closed-list `reserves[]` on its line, counted in `reserves_lignes`.
    Partial coverage: zero never means “never won a contract”. Paid via x402 ($0.02 in USDC or EURC).
    When you report a result, cite its `citation` verbatim.'
- name: get_spanish_company_public_procurement
  description: 'Public-procurement record of a Spanish company from the Plataforma de Contratación del
    Sector Público (Ministerio de Hacienda CODICE feeds: hosted profiles and aggregated regional platforms
    with archives since 2012, minor contracts of the hosted profiles since 2018, daily updates): contracts
    WON matched by legal-person NIF (`attributions`: buyer with DIR3, subject, CPV, lot, closed-list result
    such as awarded or formalised, award date, amounts in EUR excl. and incl. tax as published, tenders
    received, SME flag) and notices ISSUED as a buyer (`avis_emis`, public entities with a NIF); minor
    contracts in their own lists (`contrats_mineurs` won, `contrats_mineurs_passes` as buyer), named in
    `blocs_absents` (collecte_en_cours) until first collected; newest first, capped at 100 per list, total
    and cut in `listes_bornees`. Never a natural-person winner (DNI, NIE or masked identifier; refused
    without charge) nor a consortium without its own NIF; a file cancelled by the source is no longer
    served as awarded. An aberrant award date is served as published with a closed-list `reserves[]` on
    its line, sorted as a missing date, counted in `reserves_lignes`. Partial coverage: zero never means
    “never won a contract”; a NIF with no row, or a source placeholder NIF (`identifiant_bouche_trou`),
    answers 404 without charge. Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite
    its `citation` verbatim.'
- name: get_irish_company_insolvency
  description: 'Insolvency status of an Irish company from the Companies Registration Office register
    (CRO Open Data, CC BY 4.0, complete daily snapshot): procedure DERIVED from the published status (liquidation,
    liquidation stayed, examinership, administration) with its date; strike-off (listed or struck off)
    and dissolution reported separately; `aucune_procedure` is a measured fact on the complete snapshot
    (the CRO publishes neither the liquidator nor court orders). 400 without charge for a malformed number,
    404 without charge when unknown or of an unknown CRO type, 503 fail-closed without a fresh snapshot.
    Price $0.01. The company file itself is served by the generic EU company lookup with pays=IE. When
    you report a result, cite its `citation` verbatim.'
- name: get_cypriot_company_officers
  description: 'Cypriot company officers from the Registrar of Companies open data (DRCOR, data.gov.cy,
    CC BY 4.0, monthly national snapshot): every mandate published for the company — directors, alternate
    directors, company secretaries, assistant and deputy secretaries, authorised persons of overseas companies
    — with the register''s Greek role label and a closed-list family (role.famille), sorted by family
    then name; `aucun_mandat_publie` is measured on the complete snapshot. Name and role only: the source
    publishes no birth date, address, nationality or appointment date, and does not tell natural persons
    and corporate officers apart. Legal persons only: HE (company) and AE (overseas company); business
    names, partnerships and BN are refused before payment. 503 fail-closed when the monthly snapshot is
    missing or older than 45 days. Paid via x402 ($0.01). When you report a result, cite its `citation`
    verbatim.'
- name: get_lithuanian_company_accounts
  description: 'Lithuanian company annual accounts: balance sheets and profit-and-loss statements filed
    at the Juridinių asmenų registras (Registrų centras open data on data.gov.lt, CC BY 4.0, financial
    years 2015+, daily snapshot): EVERY filed financial year in one call: non-current and current assets,
    total assets (published or summed), equity, liabilities, tangible fixed assets, revenue, income, profit
    before tax, net profit, in EUR as published; filing template and standard, filing date. Only structured
    filings exist in the source (partial coverage stated); source lines published twice are merged and
    any disagreement is flagged in postes_divergents. Null = not published, never zero. Unknown JAR code,
    no structured filing or an individual enterprise (individuali įmonė, IĮ), its branch (individualios
    įmonės filialas) or representative office (individualios įmonės atstovybė), or an undecided form =
    404 (no charge). Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation`
    verbatim.'
- name: get_lithuanian_company_insolvency
  description: 'Lithuanian company insolvency status from two official open-data sources (data.gov.lt,
    CC BY 4.0, daily snapshot): the legal status at the Juridinių asmenų registras (31 closed-list codes:
    bankruptcy opened, bankrupt, in liquidation, liquidation due to bankruptcy, restructuring, removed…)
    and the AVNT case files since 2020: bankruptcies (court, initiator, opening, liquidation, termination,
    closing and removal dates, simplified procedure, intentional-bankruptcy ruling), restructurings (plan
    approval, end) and intentional bankruptcies, each with en_cours derived from the published dates.
    `aucune_procedure: true` is a measured fact on both complete snapshots for a company known to the
    register; AVNT only goes back to 2020. Unknown JAR code or an individual enterprise (individuali įmonė,
    IĮ), its branch (individualios įmonės filialas) or representative office (individualios įmonės atstovybė),
    or an undecided form = 404 (no charge). Paid via x402 ($0.02 in USDC or EURC). When you report a result,
    cite its `citation` verbatim.'
- name: get_latvian_company_events
  description: 'Latvian company legal events from the official Uzņēmumu reģistrs open data (CC0, daily
    national photo): liquidations and activity terminations (incl. by court or tax authority), mergers,
    acquisitions, divisions and transformations with the other company''s number (never an individual
    merchant''s), VID activity suspensions, and securing measures (prohibitions, liens, attachments) with
    the registering institution. Closed-list types plus source code and wording. The answer carries the
    company''s statut and statut_detail: an active company with no current entry gets aucun_evenement:
    true; a struck-off company whose entries the register removed returns 404 radiee_inscriptions_retirees,
    not billed; one that keeps only its reorganisations is served with blocs_absents (the liquidation,
    suspension and surete families, reason radiation_inscriptions_retirees). Legal persons only: an individual
    merchant (IK), a sole trader or a form not recognised as a legal person returns 404, not billed. Paid
    via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_latvian_company_shareholders
  description: 'Latvian company members (SIA) and registered shareholders (AS) from the official Uzņēmumu
    reģistrs open data (CC0, daily): number of shares, nominal value and currency as published, votes,
    share of nominal capital, holding start date. Corporate holders are named with their registration
    number; natural persons, individual merchants included, are COUNTED, never named (GDPR); dematerialised
    shares show the depository only. Group links for KYB. The answer carries the company''s statut and
    statut_detail: an active company with none gets aucun_associe_inscrit: true; a struck-off company
    whose records the register removed returns 404 radiee_inscriptions_retirees, not billed; one that
    keeps some is served under partial coverage. Legal persons only: an individual merchant (IK), a sole
    trader or a form not recognised as a legal person returns 404, not billed. Paid via x402 ($0.02 in
    USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_estonian_company_accounts
  description: 'Estonian company annual accounts: annual-report key figures from the official e-Business
    Register open data (RIK, CC BY 4.0, refreshed MONTHLY): EVERY published financial year since 2019
    in one call: balance sheet (assets, equity, current/non-current liabilities, cash), revenue, employee
    expense, depreciation, operating profit, profit before tax, net profit and average FTE headcount,
    in EUR as published (null = not published, never zero). Statutory and consolidated figures kept apart.
    Filings submitted as PDF only carry no structured figures and are not served. A sole proprietorship
    (FIE) or an unrecognised legal form returns 404, not billed. No default-risk score is computed for
    this country yet: the response carries score_defaillance (statut non_evaluable, closed-list reasons
    explained by GET /v1/lecture); never read it as a low score. Paid via x402 ($0.02 in USDC or EURC).
    When you report a result, cite its `citation` verbatim.'
- name: get_estonian_company_registry_rulings
  description: 'Registry rulings (määrused) of an Estonian company from the official e-Business Register
    open data (RIK, CC BY 4.0, DAILY national photo): registry entries, orders to remedy defects, warnings
    of striking-off for an unfiled annual report, warnings of compulsory dissolution for insufficient
    net assets, and annual-report fines, each with its date, extra deadline, status and force date, Estonian
    codes and labels as published. An `alerte` flag marks the CLOSED list of warning/fine types returned
    with the answer; `nombre_alertes` excludes only rulings whose `etat_code` is EXPLICITLY known as resolved
    (currently `L` only): a qualified ruling later resolved that way keeps `alerte: true` but no longer
    counts, while every other state (including `J`, `K`, or any code not yet seen) still counts, fail-closed
    on the unknown. `types_non_qualifies` lists this entity''s other rule types, so a zero is never read
    as “no warning”. A still-registered entity with no ruling returns an explicit positive answer, dated
    with the photo actually served (`photo_le`); a struck-off entity leaves the open data entirely and
    returns 404 instead of a false clean sheet; so does a sole proprietorship (FIE), an unrecognised legal
    form, or a legal person the daily photo no longer covers (evenements_non_couverts), not billed. Paid
    via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_estonian_company_officers
  description: 'Officers and governance of an Estonian company from the official e-Business Register open
    data (RIK, CC BY 4.0), refreshed daily from the national photo: management board members, procurators,
    liquidators, bankruptcy trustees, general and limited partners, contact persons, share-register keepers
    (persons entered on the registry card), plus supervisory board members and chair, audit firms, auditors
    and bankruptcy committee members recorded beside the card. organe and role are closed lists with the
    register''s code and wording (GET /v1/lecture); current mandates only — the source publishes no end
    date or history — with the registration date; standard representation rules (statutory template texts)
    and special conditions (type only). GDPR: natural persons come with first name, last name and role
    only — never the published identifier hash, birth date, address or e-mail. Legal persons only: sole
    proprietorships (FIE) are refused (404, payment cancelled). A known legal person with no registered
    role gets aucun_mandat_inscrit: true; one known only from the monthly identity copy, not covered by
    the daily photo, is refused (404 mandats_non_couverts, payment cancelled). Paid via x402 ($0.01 in
    USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_estonian_company_shareholders
  description: 'Members and shareholders of an Estonian company from the official e-Business Register
    share register (RIK, CC BY 4.0), refreshed daily from the national photo: holding percentage, nominal
    value and currency as published (EEK before 2011, never converted), ownership type (sole, joint, undivided),
    verification source and registration date; AS shareholders and founders recorded beside the card under
    the same rule; share pledges and conditional transfers; capital from the general data when fresh;
    detenu_par_personnes_physiques_pct. Corporate holders are named with their registrikood or foreign
    code and country; natural persons are COUNTED with their holding and never named (GDPR, no chain to
    natural persons). Legal persons only: sole proprietorships are refused (404, payment cancelled), as
    is a legal person known only from the monthly identity copy, not covered by the daily photo (404 mandats_non_couverts).
    aucun_associe_inscrit: true is a register fact for a known legal person (its meaning depends on the
    legal form: dematerialised AS shares are held by the central depository). Paid via x402 ($0.02 in
    USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_swedish_company_accounts
  description: 'Annual accounts of a Swedish company, decoded from the official iXBRL filings Bolagsverket
    publishes free of charge (EU high-value datasets, since 3 February 2025): EVERY digitally filed fiscal
    year in one call — turnover (null = not disclosed under the K2 abridged format, never zero), operating
    and net result, total assets, equity, long- and short-term debt, average employees, plus the prior-year
    column as filed. Figures as published, in the filing currency (SEK). IMPORTANT COVERAGE LIMIT: digital
    filing is OPTIONAL in Sweden (~63% of annual reports in 2025, 53% in 2024) and the corpus starts with
    filings RECEIVED from 2020 — a company that is absent may simply have filed on paper. Officers (företrädare)
    are NOT available for Sweden: they are not part of the free datasets. No default-risk score is computed
    for this country yet: the response carries score_defaillance (statut non_evaluable, closed-list reasons
    — GET /v1/lecture explains them); never read it as a low score. Paid via x402 ($0.03 in USDC or EURC).
    When you report a result, cite its `citation` verbatim.'
- name: get_swedish_company_registry_events
  description: 'Registry events of a Swedish company from Bolagsverket''s official weekly national file
    (free EU high-value dataset): incorporation date, ONGOING winding-up or restructuring proceedings
    (bankruptcy/konkurs, liquidation, company reconstruction, composition, merger, division, cross-border
    conversion, bank resolution) with their start dates, and deregistration with its coded reason. Use
    it to check whether a Swedish counterparty is bankrupt, in liquidation or already struck off before
    signing or paying. A registered company with NO proceeding returns an explicit positive answer (procedure_en_cours:
    false) — the register is authoritative. Note: only ONGOING proceedings are published, and a company
    already struck off returns procedure_en_cours: false — the proceeding ended with the striking-off,
    whose coded reason carries the outcome. Paid via x402 ($0.02 in USDC or EURC). When you report a result,
    cite its `citation` verbatim.'
- name: get_czech_company_insolvency
  description: 'Insolvency record of a Czech company from the official ISIR register (Insolvenční rejstřík,
    Ministry of Justice), history since 2008: every proceeding with its case number (spisová značka),
    court, published status (úpadek, konkurs, reorganizace, oddlužení...), opening and closing dates,
    claim-filing deadline and its event trail with official document links — Czech labels as published.
    The event list is capped at the 100 MOST RECENT events per case: nombre_evenements carries the real
    total and evenements_tronques says whether it is truncated. Publication is compulsory by Czech law,
    so a company with no proceeding gets an explicit positive answer (aucune_procedure: true), dated by
    collecte_le (last complete collection; a stale stock returns 503 rather than a stale clean answer).
    LEGAL-PERSON debtors only: natural persons are excluded at ingestion (GDPR minimisation), so a sole
    trader''s or other natural person''s IČO — the majority of Czech IČOs — is refused (404) rather than
    reported as clean. Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation`
    verbatim.'
- name: get_polish_company_registry_events
  description: 'Registry EVENTS of a Polish company, derived from the official KRS daily bulletin (Krajowy
    Rejestr Sądowy, Ministry of Justice): liquidation opened or closed, bankruptcy, restructuring, activity
    suspension and resumption, dissolution, mergers and transformations, tax or social-security arrears
    and enforcement, annual-accounts filings, changes of name, legal form, registered office or share
    capital, and strike-off. Each event carries the bulletin day it appeared on and, when the register
    publishes one, the register''s own date. The response always states the observation window (gap-free
    by construction) — the register publishes no retroactive event history. IMPORTANT: this endpoint does
    NOT check that the KRS number exists — a non-existent number returns exactly the same `aucun_evenement:
    true` answer as a real company that stayed quiet; the `existence` block says which case applies, and
    get_european_company_profile (pays=PL) settles existence with a 404. GDPR by design: no officers,
    shareholders, liquidators or curators, never a PESEL — and no FREE TEXT from the register either:
    the narrative wording of a decision can name a notary or a receiver, so it is read only to extract
    a date and then discarded (that date is flagged `date_source_inferee`). What is served: the event
    type from a closed list, its register section, its dates, its wpis number, amounts, and the deciding
    court or authority. A KRS whose recorded legal form is not on the served list (foreign entrepreneur
    or its branch, professional partnership, missing form) is refused (404 forme_juridique_non_servie,
    payment cancelled). Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation`
    verbatim.'
- name: get_polish_company_insolvency
  description: 'Polish company insolvency from the official KRS register extract (Ministry of Justice
    open API, live, 24 h cache): every proceeding entered since registration, open or closed: bankruptcy
    (upadłość), restructuring under the 2016 law, arrangement under the old law, liquidation, dissolution,
    suspension of activity; each with its Polish term, opening and closing dates, court and case number;
    plus dismissed bankruptcy petitions and protective measures. Trustees, liquidators, supervisors and
    debtor representatives are never named (counted in mandataires_omis). aucune_procedure means none
    entered in the register: a proceeding opened but not yet entered is not seen. A struck-off company
    is read from the full extract. A legal form off the served list (foreign entrepreneur or its branch,
    professional partnership) returns 404, not billed. 10-digit KRS number. Paid via x402 ($0.02 in USDC
    or EURC). When you report a result, cite its `citation` verbatim.'
- name: list_polish_company_filings
  description: 'Polish company annual-accounts filings recorded in the official KRS register extract (Ministry
    of Justice open API, live, 24 h cache): every filing since registration, newest first: financial statements
    (own and consolidated) with their filing date, auditor''s report, approval resolution, management
    report, sustainability attestation, each with the period covered. Metadata only, never the figures
    or the document: the Financial Documents Repository (RDF) has no open API. aucun_depot: true is what
    the extract shows, not a proof of non-filing. A legal form off the served list (foreign entrepreneur
    or its branch, professional partnership) returns 404, not billed. 10-digit KRS number. Paid via x402
    ($0.01 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_french_company_intelligence
  description: 'Use for a GO/NO-GO decision (credit, investment, partnership) on a French company. Company
    INTELLIGENCE report — every Sirenic block cross-referenced in one call: identity & officers, financials
    with 3-year trend, sector positioning vs NAF peers, failure-risk score, BODACC legal alerts, commercial-court
    decisions linked to the company (Judilibre stock since 2024-12-31: counts, closed-list nature and
    role, official links; partial coverage stated — never « no litigation »), sanctions screening (6 official
    lists, company + each officer), public procurement (French DECP + EU TED), IP assets, cached capital
    structure, industrial-risk synthesis (Seveso/ICPE), AMF PSAN/SGP register statuses, HATVP lobbying
    summary and a live VIES VAT check. Returns closed-list SIGNALS traced to their register source, synthese.conclusions_interdites
    (closed list of what THIS report does not allow you to infer — never a probability of default, a credit
    rating or an absence of risk; plus group health, current situation, cash position or an established
    sanction when the read data cannot support them), a deterministic verdict (solide/correct/fragile/critique)
    with synthese.motifs_verdict (closed-list codes that decided it) and synthese.verdict_plafonne_par
    (name-match doubts that capped it at « correct »: when non-empty, read « correct » as « correct subject
    to verification »), and strengths/vigilance points. The financial block carries decalage_analytique
    (latest filing known at the register vs latest year analysed) and the summary says it when a newer
    filing exists. Since v1.7 the synthese also carries reserves (closed-list reading caveats: holding
    scope, newer filing not analysed, old accounts, unpublished cash, weak name matches, unavailable blocks…),
    portee (what the verdict covers), confiance_financiere (the score band) and par_domaine (ten domains,
    each in its own closed list, all projected from blocks already served) — the verdict word itself is
    unchanged. Every block states the official register it comes from and its `as_of` date, so the report
    is auditable offline once the Ed25519 signature is verified. Since 2026-09-06 a company with no computable
    financial ratio (in practice no public accounts) and no other adverse signal gets `indeterminable`
    — insufficient public data, neither good nor bad — instead of `correct`. The flagship due-diligence
    call. A SIREN whose administrative status or legal category is missing in Sirene is refused: 404 identite_incomplete
    (body: siren, champs_absents, fiche), never charged. Paid via x402 ($1.00 in USDC or EURC). When you
    report a result, cite its `citation` verbatim.'
  category: kyb
  rest: /v1/intelligence/{siren}
- name: get_french_company_pdf_report
  description: 'On-demand PDF report of a French company: a shareable due-diligence dossier (formatted
    KYB file: identity, officers, legal alerts, financials, sanctions screening; includes the AI health
    summary when cached). Every page footer carries a public verification link (/verifier/ and the response''s
    verification number) that whoever receives the PDF can open. Returns the PDF as base64. A SIREN whose
    administrative status or legal category is missing in Sirene is refused: 404 identite_incomplete (body:
    siren, champs_absents, fiche), never charged. Paid via x402 ($0.50 in USDC or EURC).'
  category: reporting
  rest: /v1/rapport/{siren}
- name: list_french_company_documents
  description: 'List official documents filed by a French company at the INPI RNE registry: legal deeds
    (statutes, general-meeting minutes, mergers...) and filed annual accounts, with document IDs to download
    the PDFs. Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: download_french_company_document
  description: 'Download an official company document (PDF) from the INPI RNE registry. Use IDs from list_french_company_documents.
    Filed annual accounts (type bilans): any payer, x402 or api_key. Legal deeds (type actes: statutes,
    general-meeting minutes) are RESERVED to identified Sirenic accounts since 2026-09-19 because they
    carry personal data: pass api_key, otherwise 401 compte_requis and nothing is charged. Returns the
    PDF as base64 — documents typically weigh 1-10 MB. $0.10 (x402 in USDC or EURC, or account credits).'
- name: prospect_french_companies
  description: 'French B2B prospecting and lead generation: build company lists over the full French registry,
    filtered by NAF activity code, departement/postal code, legal form, workforce, age, RGE certification,
    gender-equality index. Returns up to 100 active companies per page; each page is one x402 payment
    ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: query_french_companies
  description: 'French company search with free combined criteria on a pre-joined table of the official
    registries (Sirene identity and head office, last filed accounts, public signals). mode is required:
    compter returns the exact count ($0.002 in USDC or EURC), lister one page of 100 companies ($0.02
    per page, 100 pages at most) with the exact total; count first, then list. criteres: up to 20 conditions
    {champ, op, valeur} combined with AND (OR goes through in); valeur is typed by the field (string,
    number, true or false, YYYY-MM-DD, [min, max] for entre, an array of 1 to 50 values for in, or for
    hors, which excludes SIRENs on identite.siren only); criteres is at most 2048 characters once JSON-encoded
    (beyond: criteres_trop_longs, refused here before any quote); each field''s operators, unit, closed
    values and meaning are served free by GET /v1/lecture. Active legal persons by default (identite.etat
    = A; any criterion on identite.etat replaces it): no officer, no person. A refusal is a 400 from the
    closed list (parametre_inconnu, criteres_illisibles, criteres_trop_longs, trop_de_criteres, champ_inconnu,
    champ_indisponible, champ_non_filtrable, operateur_refuse, valeur_invalide, personnes_physiques_exclues,
    tri_refuse, page_hors_bornes, champ_de_sortie_inconnu), never charged; a query beyond the 15 s budget
    returns requete_trop_large, never charged: narrow the criteria. Paid via x402. When you report a result,
    cite its `citation` verbatim.'
- name: find_french_lookalike_companies
  description: 'Find French companies that look like your best customers: give 2 to 5 customer SIRENs
    and, optionally, a region or a departement; Sirenic deduces their profile from the official registries
    (NAF codes, workforce brackets, legal forms, creation dates, common area) and returns the first page
    of 100 active legal persons matching it, the customers excluded, with the exact total ($0.02 in USDC
    or EURC). Under 50 results the profile widens one step at a time, each step stated in profil.elargissements;
    an example set aside is stated by its rank in profil.ecarts, never by its SIREN. profil.criteres reads
    the next pages through query_french_companies (mode lister, page 2 and on). No ranking by likeness,
    no person. A refusal is a 400 from the closed list (parametre_inconnu, exemples_invalides, zone_invalide,
    profil_impossible), never charged; beyond the 15 s budget, requete_trop_large, never charged. Paid
    via x402. When you report a result, cite its `citation` verbatim.'
- name: get_french_company_health_summary
  description: 'Business-health and risk read-out of a French company, in French AND English, from official
    data only: verdict, strengths, warning signs, activity trend, confidence level, plus the reconciled
    grid in machine-readable codes. A model fills a closed evaluation grid (no free text, no name, no
    figure of its own); every number, date and sentence is assembled by Sirenic, and deterministic guards
    overrule the model when the filed accounts contradict it — corrections are listed in `divergences_modele`.
    Entities that file no annual accounts (non-profits, sole traders, companies under a year old, ceased
    companies) return `verdict: "non_concluant"` with most fields `non_evaluable`, and the prose says
    so explicitly — call get_french_company_profile instead if you only need identity. Cached 7 days.
    Paid via x402 ($0.15 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
  category: risk
  rest: /v1/entreprise/{siren}/sante
- name: get_french_company_kyb_file
  description: 'Complete KYB (Know Your Business) file for a French company in one call: a comprehensive
    BUNDLE consolidating identity, officers, BODACC legal alerts, commercial-court decisions linked to
    the company (Judilibre, since 2026-09-24: the 20 most recent with official links; partial coverage,
    so zero decisions is a non-conclusive absence, never ''no litigation''; a sole proprietorship is not
    covered), filed financials, sanctions screening of the company and each officer (6 official lists),
    VAT number and a completeness score. Use this when you want the whole due-diligence picture at once;
    if you only need one part, call the dedicated tool instead (get_french_company_profile, get_french_company_legal_alerts,
    get_french_company_court_decisions, get_french_company_financials, or screen_sanctions_lists): they
    are cheaper. Every block carries its provenance: official register, licence, version and `as_of` date,
    plus `precision_as_of` telling whether that date is the upstream official publication, Sirenic''s
    ingestion or a live consultation. The file ends with `verification` (number and public link, /verifier/):
    whoever receives the file can check it. A SIREN whose administrative status or legal category is missing
    in Sirene is refused: 404 identite_incomplete (body: siren, champs_absents, fiche), never charged.
    get_french_company_profile still serves its profile, with that caveat. Paid via x402 ($0.15 in USDC
    or EURC). When you report a result, cite its `citation` verbatim.'
  category: kyb
  rest: /v1/kyb/{siren}
- name: get_french_company_kyb_batch
  description: 'Batch KYB: full KYB files for 2 to 100 French companies in one call, commercial-court
    decisions (Judilibre) included since 2026-09-24. Billed per company at $0.105 (30% off the $0.15 unit
    price) via x402: the amount is the unit price times the number of SIREN. A SIREN with no diffusible
    company is returned with trouve=false and billed as one lookup. A SIREN whose identity is incomplete
    (administrative status or legal category missing) comes back trouve=false with motif identite_incomplete,
    billed as one lookup. Each file carries its own per-block provenance (official register, as_of date).
    Ideal for prospecting and compliance agents processing lists. For a customer or supplier list, pass
    vue=synthese: the full files of a large batch do not fit in a tool result. One compact line per SIREN
    (status and cessation date, insolvency proceedings and deregistrations, sanctions screening status
    and match count, never a name, court-decision count, last filed accounts, completeness, reserves),
    same checks, same price, batch-level provenance; the text result is compact JSON on a single line.
    procedure_le is the BODACC publication date of the latest proceedings notice, never the judgment date;
    radiation_le, the BODACC publication date of the latest deregistration notice, never the date of a
    judgment or of the deregistration. By default, Claude Code (2.1.293, measured on 2026-10-14) passes
    the model a tool result of up to 25,000 tokens counted by the API (a result of up to 50,001 characters
    passes uncounted); beyond that, the model only receives an error message and the path of a file. At
    the bounded worst case (each field of the lines and of the batch head at its bounded longest), 58
    lines are guaranteed to fit, counted exactly: 1,848 tokens for the batch head and 395 per line. With
    real companies, measured on 2026-10-08: 100 SIREN took 16,698 tokens and 80 took 13,754 (2.1 characters
    per token). A full-size request quotes up to $10.50, above the $1.00 single-payment cap that x402
    clients apply BY DEFAULT since @x402/core 2.23 (spendControls): raise spendControls.maxAmountPerPayment,
    or set spendControls: false, before signing; otherwise your own client rejects the quote without ever
    calling us. When you report a result, cite its `citation` verbatim.'
  category: kyb
  rest: /v1/kyb/batch
- name: get_french_company_identity_batch
  description: 'Batch identity check of a French customer or CRM file: 2 to 150 lines per call, each a
    SIREN, SIRET, French VAT number or name|postcode, in file order. Use when a user hands over a customer
    export, e.g. « Voici mon export clients, complète et corrige SIREN, SIRET et TVA. » or « Enrichis
    et nettoie ma base CRM : SIREN, TVA, adresse, cessés et doublons. » Per line: resolution (resolu,
    a_confirmer with up to 5 candidates ranked by score_confiance, introuvable, siren_invalide, siren_inconnu,
    non_diffusible), SIREN, head-office SIRET, status and cessation date, address, VAT number checked
    live on VIES (indisponible, never a false invalide), duplicates flagged (doublon_de). VAT checks:
    in French business hours, VIES serves one verdict every 4 to 5 s and refuses concurrency; before pipelined
    checks, a full batch had 15 of 262 resolved lines checked; with them, outside business hours (23:51
    UTC), 105 of 265; measured 2026-10-08; a line whose check could not start in time says non_verifie,
    budget_vies_epuise. Never a silent choice: a name is resolved only by a single candidate of the complete
    index union at its postcode that bears that name (legal name, usual name or acronym), otherwise a_confirmer;
    natural persons are never served as candidates (counted in candidats_non_servis). With ambiguous names,
    send 50 lines per call (each a_confirmer line carries its candidates). Request line up to 11000 bytes:
    about 148 names of 63 characters. With depuis (a past day or today), at most 20 lines per call: each
    resolu line also carries changements, what changed since that date in BODACC and the local stocks
    (verdict nouveautes, rien_de_nouveau or lecture_incomplete, totals per type, the 3 latest facts, the
    window actually read, lecture_complete and the line''s blocks not read; stocks stale for that date
    are named once at the top, in changements.stocks_perimes); any other line says why in motif_sans_changements;
    billed $0.01 per line. EU tenders and industrial property: get_french_company_updates_since, one company
    per call. Billed per line at $0.003 via x402, duplicates included; up to 50 lines per call are in
    the free monthly quota of a verified account''s API key (api_key). Closed lists: GET /v1/lecture.
    A full call of this tool costs at most $0.45 (150 lines), $0.20 with depuis (20 lines), within the
    $1.00 single-payment cap that x402 clients apply by default. When you report a result, cite its `citation`
    verbatim.'
- name: compare_french_companies
  description: 'Use when asked to compare, rank or choose between 2 to 5 French companies (customers,
    prospects, suppliers, competitors). Returns a cross-table (identity, deterministic default-risk score,
    latest filed accounts with their accounting scope, BODACC legal alerts, sanctions screening of the
    legal name), per-axis rankings and, importantly, an explicit comparabilite block stating when the
    companies are NOT comparable (different sectors, different sizes, a holding in the batch). NEVER returns
    an overall winner: a holding with no debt outranks a large industrial group on default risk, which
    would be misread as a verdict on quality. Since 2026-09-08 nine rankings (risk, revenue, net result,
    EBITDA margin, lowest debt ratio, liquidity, revenue growth, cash vs short-term debt, seniority) each
    carry a status in `eligibilite_classements` (`statut` autorise/interdit with `raison`, `type` evaluatif/descriptif,
    `donnee`, `perimetre`, `exercices`, `couverture`): the evaluative `risque_le_plus_faible` is served
    ONLY when the batch is comparable for a score and the ranked scores rest on exactly the same axes
    (`axes_communs`); amounts are forbidden across different fiscal years, ratios also across different
    sectors or sizes; a forbidden ranking is absent from `classements`, never rank companies from `solidite.score_risque`
    or the ratios yourself when it is `interdit`. `solidite.classement_risque` repeats per company whether
    it is eligible, ranked, and why not (`score_non_concluant`, `axes_differents`); the score stays served
    with its `couverture_axes`. Billed per company at $0.12 via x402, the amount is the unit price times
    the number of SIREN. When you report a result, cite its `citation` verbatim.'
- name: screen_sanctions_lists
  description: Use BEFORE any payment, contract or onboarding involving the name. AML sanctions screening
    of a person or company name against 6 official sanctions lists (UN consolidated, EU FSF, US OFAC SDN,
    UK Sanctions List, French asset-freeze register, Swiss SECO list). Returns fuzzy matches with a 0-100
    confidence score — never a bare yes/no. Each list is reported with its entry count, its publication
    date and what that date means (official upstream publication vs. Sirenic ingestion — OFAC publishes
    none). Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.
  category: compliance
  rest: /v1/sanctions/check
- name: prepare_european_invoice_file
  description: 'Use when the company you are about to invoice or pay is BELGIAN or POLISH and you must
    verify the supplier before payment (for France, use prepare_french_invoice_file). ONE call returns
    official registry identity, the VAT number checked against VIES, Peppol reachability for Belgium (whose
    structured B2B e-invoicing mandate has been in force since 1 January 2026) and, uniquely in Poland,
    whether the IBAN is actually DECLARED by that taxpayer in the official White List (wykaz podatnikow
    VAT). The Polish check has FISCAL scope: paying more than 15,000 PLN into an undeclared account costs
    the buyer the deduction and creates joint liability for the supplier''s VAT (art. 117ba Ordynacja
    podatkowa), so an undeclared account is a blocking reason. Everywhere else the bank leg is a FORM
    check (ISO 13616 structure + mod-97 key) plus bank identification, never a payee verification: with
    an `iban` supplied, verdict.non_verifie sits next to the verdict and names what is not checked (account
    existence, holder name), and the White List itself proves the account is DECLARED by that taxpayer,
    never who holds it. Returns a deterministic pret_a_facturer verdict with closed-list reasons, each
    tagged blocking or informational. In Poland, a taxpayer without a KRS number (a CEIDG sole trader,
    or an undecided case) gets these checks without its name or address, the omission counted in ecartes;
    so do, in Belgium, an entity without legal form (a natural-person enterprise) or of a form without
    legal personality, and in Poland a KRS entity of an undecided form (a foreign entrepreneur''s branch).
    The response is Ed25519-signed and carries provenance[]: one entry per block served, with the official
    register, its licence and its as_of date, the White List entry carrying the date actually sent to
    the ministry''s API, so the payment decision is provable to an auditor offline. Paid via x402 ($0.03
    in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_belgian_insider_transactions
  description: 'Insider transactions at a Belgian listed company (managers transactions under MAR Article
    19, as notified to the FSMA): are its managers buying or selling? Issuer-level aggregate over a rolling
    12 months: notification counts, gross buy and sell amounts, net flow, breakdown by declarer category,
    plus the underlying notifications. No individual is ever named, and the breakdown is withheld when
    it would single someone out. A day of the window that the FSMA listing could not return whole is named
    in collecte_incomplete (counts are then lower bounds). Use it as a governance signal before investing
    in or contracting with a listed Belgian company. Paid via x402 ($0.02 in USDC or EURC). When you report
    a result, cite its `citation` verbatim.'
- name: get_german_insider_transactions
  description: 'Insider transactions at a German listed company — directors'' dealings under MAR Article
    19, as notified to BaFin: are its managers buying or selling? Issuer-level aggregate over a rolling
    12 months — notification counts, gross buy and sell amounts, net flow, breakdown by declarer category,
    plus the underlying notifications. Query by LEI or ISIN (BaFin publishes no company register number).
    No individual is ever named, and the breakdown is withheld when it would single someone out. Paid
    via x402 ($0.02 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_company_licences
  description: 'Regulatory authorisations of a French company by SIREN: payment institution, e-money institution,
    account-information provider, payment agent or exempt entity (EBA PSD2 register, refreshed daily),
    insurance undertaking (EIOPA), electronic-communications operator (ARCEP) — with authorisation dates,
    licensed PSD2 services, EEA passporting and withdrawals. Use it before paying, onboarding or contracting
    with a regulated counterparty. Not authorised is an answer too. Paid via x402 ($0.02 in USDC or EURC).
    When you report a result, cite its `citation` verbatim.'
- name: get_french_association_profile
  description: 'Official profile of a French association (loi 1901) by RNA number from the Répertoire
    national des associations (Ministry of the Interior, monthly export): title, purpose and Waldec purpose
    codes, nature and grouping, position (active/dissolved/deleted), creation, declaration, JO publication
    and dissolution dates, registered office, website, RUP number as declared, prefecture, and the SIREN
    when Sirene confirms an association. Covers associations WITHOUT a SIREN — use search_french_associations
    first when you only have a name. No officer or declarant data; Alsace-Moselle excluded (local law).
    Unknown identifier = 404, not charged. Paid via x402 ($0.005 in USDC or EURC). When you report a result,
    cite its `citation` verbatim.'
- name: search_french_associations
  description: 'Use FIRST whenever a French association (loi 1901, nonprofit, charity, club) is mentioned
    by NAME without an identifier. Searches the Répertoire national des associations (RNA) by trigram
    similarity on the title, with optional postal-code, department and position filters. Returns up to
    20 matches with score_confiance (0-1) and the RNA number to pass to get_french_association_profile
    or get_french_association_notices; siren when Sirene confirms it. Associations with AND without a
    SIREN; the legacy file (no declaration since 2009) is flagged fichier_source: import. Paid via x402
    ($0.002 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_french_association_notices
  description: 'Official Journal notices (JOAFE, DILA) of a French association by RNA number — the association
    equivalent of BODACC: creations, modifications (title, purpose, registered office), dissolutions,
    corrections, most recent first, with issue and declaration dates, prefecture, purpose themes and the
    PDF file name. Carries couverture (first and last loaded issue): no notice inside that window is a
    fact, not a gap. Weekly issue loaded every Tuesday; a stale stock returns 503 and is not charged.
    Paid via x402 ($0.01 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_french_company_industrial_risk
  description: 'Industrial-risk and environment (ESG) profile of a French company from the official ICPE
    register (Géorisques/DGPR): classified facilities with Seveso status (upper/lower tier), authorisation
    regime, activity state, IED flag and a per-SIREN risk synthesis. A company with no classified facility
    returns level `aucun` — the clean answer is the signal. Paid via x402 ($0.01 in USDC or EURC). When
    you report a result, cite its `citation` verbatim.'
- name: get_french_company_hiring_signals
  description: 'Hiring signals for a French company, derived on demand from France Travail data (snapshot
    under 24 h, nothing stored): actively-hiring yes/no/unprovable (null means absence is not provable),
    active-postings count — SIREN-keyed via France Travail''s own employer page when one exists, else
    strict company-name matching over the company''s known locations (lower bound: brand names and temp
    agencies not counted; the path used is stated in methode.comptage) — top ROME occupation families
    (their total a lower bound when the detail is partial), contract-type mix, share of postings displaying
    a pay amount, plus the Egapro gender-equality index (every published year) and the INSEE workforce
    bracket. Aggregated signals only — never posting texts or recruiter contacts. Use for sales intelligence
    (a hiring company is an active company) and HR/expansion signals. A sole proprietorship, a restricted-diffusion
    entity or a group without legal personality (INSEE category 2xxx or 9210) answers 400 with its exact
    code and is never charged. Paid via x402 ($0.02 in USDC or EURC). When you report a result, cite its
    `citation` verbatim.'
- name: prepare_french_invoice_file
  description: 'Use when you are about to invoice or pay a FRENCH company and must verify the supplier
    before payment: onboarding, first invoice, first payment, or bank details that just changed. The French
    e-invoicing mandate applies from 1 September 2026 (receiving obligatory for every VAT-liable company;
    issuing phased: large and mid-sized companies 1 September 2026, SMEs and micro-enterprises 1 September
    2027), so every French counterparty has to be checked. ONE call returns the whole agent-side file:
    legal identity & obligation dates, the computed intra-EU VAT number verified LIVE against VIES, an
    IBAN FORM check (ISO 13616 structure + mod-97 key) with the bank identified from official registries
    when `iban` is supplied, and a deterministic verdict pret_a_facturer (true/false) whose reasons come
    from a CLOSED list, each tagged blocking or informational and traced to its source. A VIES outage
    yields an honest informational reason, never a false invalid. Not a payee verification, and the verdict
    says so where the decision is read: with an `iban` supplied, verdict.non_verifie sits NEXT TO pret_a_facturer
    and names what is never checked — the account''s existence and the holder''s name. An IBAN on a published
    list of known documentation samples is flagged by the informational reason iban_exemple_documentation,
    whose absence is not proof of the contrary (the verdict stays green: such an IBAN is well-formed;
    the account''s existence is not tested). The response is Ed25519-signed and carries provenance[] —
    one entry per block served, with the official register, its licence and its as_of date — so the decision
    stays auditable offline months later. A SIREN whose administrative status or legal category is missing
    in Sirene is refused: 404 identite_incomplete (body: siren, champs_absents, fiche), never charged.
    Paid via x402 ($0.03 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
  category: invoicing
  rest: /v1/facturation/dossier
- name: verify_french_invoice
  description: 'Invoice verification for France — use when you HOLD an invoice (or its extracted fields)
    and must check that the identifiers it displays belong together before paying it. Cross-checks in
    ONE call: the SIREN against the official registry (existence and active status, live), the VAT number
    printed on the invoice against the one computed from the SIREN (the French key is deterministic) AND
    live against VIES, and the IBAN''s ISO 13616 form + key digits with the bank identified. Returns a
    deterministic verdict coherent/incoherent/inverifiable with closed-list reasons traced to their source
    — flags a VAT number that belongs to ANOTHER company, a ceased supplier, or a key-invalid IBAN. A
    VIES outage yields `inverifiable`, never a false invalid. NOT a payee verification: the bank leg checks
    form only — a valid-but-swapped IBAN is not detectable, and `non_verifie` says so next to the verdict.
    At least one of tva/iban is required (a SIREN alone is a profile, not a cross-check). An incomplete
    identity (administrative status or legal category missing from the Sirene register) yields inverifiable,
    reason identite_incomplete, unless an inconsistency is found. Paid via x402 ($0.02 in USDC or EURC).
    When you report a result, cite its `citation` verbatim.'
- name: verify_iban_bank
  description: 'IBAN verification and bank validation for SEPA — use when you are about to pay a NEW or
    CHANGED IBAN, or when onboarding a supplier''s bank details, and want the cheapest check of the supplier
    before payment. Runs a FORM check on the IBAN (ISO 13616 structure + mod-97 key), identifies the bank
    from FREE official registers (France: name+LEI+SIREN via ACPR/REGAFI; Belgium, Austria, Netherlands:
    name+BIC; Germany when the Bundesbank file is loaded, incl. LEI where available; French banks get
    their BIC via the GLEIF/SWIFT BIC-to-LEI mapping). Explicitly NOT a payee verification — the account
    holder''s name is never checked and the account''s existence is not tested (verification_titulaire:
    non_disponible): a well-formed IBAN at an identified bank is no proof that the account belongs to
    your supplier. The answer says this in machine-readable form next to `valide`: nature_du_controle
    (forme | forme_et_registres), non_verifie [account existence, holder name] and exemple_de_documentation
    — true for IBANs on a published list of known documentation samples, which pass every check; the account''s
    existence is not tested; false is not proof of the contrary. The response is Ed25519-signed and carries
    provenance[] — one entry per block served, naming the official register actually consulted, its licence
    and its as_of date. For the full invoicing verdict on a French counterparty, call prepare_french_invoice_file
    instead. Paid via x402 ($0.005 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
  category: invoicing
  rest: /v1/iban/verifier/{iban}
- name: search_bodacc_announcements
  description: 'Search French BODACC legal announcements by CRITERIA instead of by company — the monitoring
    question no other Sirenic tool answers: WHICH companies entered insolvency proceedings in department
    59 this week? Pick a family (collective/insolvency proceedings, deregistrations, sales and transfers,
    incorporations, accounts filings, conciliation, professional recovery, modifications, registrations,
    miscellaneous), a date window (`depuis`, optional `jusqu_a`) and optionally a French department code.
    Returns up to 100 announcements, newest first, each with SIREN, court, town, department and the judgment
    in closed fields (nature, date, family, category, appointed officers by role and form, never a name,
    date of cessation of payments), plus `tronque` when there were more. The judgment''s operative FREE
    TEXT is deliberately removed everywhere — it names court-appointed administrators with their address
    — so facts living only in that text are NOT here: follow `url_bodacc`, or get_french_company_legal_alerts
    for a single company. Announcements about SOLE TRADERS are deliberately EXCLUDED (their name is personal
    data) and their count is returned in `exclues_personnes_physiques`, and records whose person type
    was unreadable are counted apart in `exclues_type_indetermine` (fail-closed guard). An announcement
    is not a verdict: the insolvency family also contains closures and cancellations — read the CURRENT
    state with get_french_company_legal_alerts or get_french_company_default_risk. Paid via x402 ($0.03
    in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_french_company_file
  description: 'Full French company file in ONE call, paying only for the blocks you ask for — for when
    you need several things about the same company and do not want to chain calls. The identity base is
    $0.005; add any of etablissements, alertes_bodacc, contentieux, finances, marches_publics, marches_publics_ue,
    lobbying, risques_industriels, agrements, pi, documents, facturation_prep, score. Each block costs
    exactly what its dedicated endpoint costs, and the total is capped at $0.35. Any block that cannot
    be served is NAMED with a reason from a closed list: aucune_donnee (a negative answer, e.g. no patents),
    non_diffusible (GDPR/partial disclosure), non_couvert (not a proven legal person), panne_amont (upstream
    register down) or identite_incomplete (incomplete identity). For a verdict rather than raw blocks,
    use get_french_company_intelligence ($1.00). An identity whose administrative status or legal category
    is missing in Sirene is served with blocs_absents (raison identite_incomplete) and a partial provenance.
    Blocks built on it (score, facturation_prep) are absent for that reason (identite_incomplete). If
    no requested block is served and one is down, the call returns 503 (a retry may serve it); else if
    one is refused for that reason, 404 identite_incomplete; neither is charged. Paid via x402 in USDC
    or EURC. When you report a result, cite its `citation` verbatim.'
- name: suggest_company_names
  description: 'FREE. French company name autocomplete: type the beginning of a company name and get up
    to 5 matches with SIREN, city, postcode, NAF code and active/ceased status. Use it FIRST to turn a
    name into the SIREN that every other Sirenic tool takes as input — no account, no API key, no payment.
    Source: the official INSEE Sirene register (open data), companies and sole traders whose record is
    publicly diffusible. Matches the START of the name, then whole words; no typo tolerance and no match-confidence
    score — for those, plus the full profile, use search_french_companies ($0.002) and get_french_company_profile
    ($0.005).'
  category: search
  rest: /v1/suggestions
- name: detect_company_identifiers
  description: 'FREE. Paste any text (email, invoice, contract, web page) and detect French/EU company
    identifiers: SIREN, SIRET (Luhn-checked), EU VAT numbers, LEI (ISO 17442 checksum), each with the
    recommended Sirenic call and its price. Use this FIRST whenever a company appears in your workflow
    (customer onboarding, prospect list, supplier invoice, due diligence) to know exactly what to verify
    and what it costs. Deterministic pattern matching; the text is never stored or logged.'
  category: utility
  rest: /v1/reperer
- name: create_surveillance_watch
  description: 'Company monitoring for France, for when the relationship OUTLASTS the check (customer,
    borrower, supplier, portfolio company): create a 30, 90 or 365-day watchlist over French companies
    and/or directors. Sirenic checks every target DAILY (BODACC filings, status & officer changes, sanctions
    and AMF-blacklist matches, PSAN/SGP status, Seveso/ICPE changes, new French & EU procurement awards,
    and since 2026-09-24 commercial-court decisions newly linked to the company, event decision_tcom_rattachee;
    for directors: new/ended public offices, diffed only on a complete list, a name matching more companies
    than one page being marked mandats_partiels from creation) and delivers events via Ed25519-signed
    webhook and/or e-mail digest, always pollable with the returned bearer token, plus an expiry reminder
    7 days ahead. No account. Paid via x402, per target AND per duration: $0.05 for 30 days, $0.135 for
    90 days, $0.50 for 365 days (amount = that unit price × number of targets, so up to $50.00 for 100
    targets over a year). No pro-rata refund. A full-size request quotes up to $50.00, above the $1.00
    single-payment cap that x402 clients apply BY DEFAULT since @x402/core 2.23 (spendControls): raise
    spendControls.maxAmountPerPayment, or set spendControls: false, before signing; otherwise your own
    client rejects the quote without ever calling us. When you report a result, cite its `citation` verbatim.'
- name: get_surveillance_watch
  description: 'Status and the 100 most recent events (total and cut in listes_bornees.evenements) of
    a watchlist created with create_surveillance_watch. Free: the surveillance_id token IS the capability.'
- name: renew_surveillance_watch
  description: 'Renew a watchlist for 30, 90 or 365 more days (possible until 7 days after expiry). The
    duration is a FREE choice: it need not match the original one, so a 30-day watch can be extended by
    a full year. The cibles parameter must repeat the exact watched targets — the quote is computed from
    it. The extension starts from the current expiry date and cannot push it beyond 400 days from now.
    Paid via x402, per target: $0.05 for 30 days, $0.135 for 90 days, $0.50 for 365 days. A full-size
    request quotes up to $50.00, above the $1.00 single-payment cap that x402 clients apply BY DEFAULT
    since @x402/core 2.23 (spendControls): raise spendControls.maxAmountPerPayment, or set spendControls:
    false, before signing; otherwise your own client rejects the quote without ever calling us. When you
    report a result, cite its `citation` verbatim.'
- name: stop_surveillance_watch
  description: Stop a watchlist and purge its data immediately (free).
- name: get_eu_procurement_awards
  description: 'European public procurement: government contracts and tender award notices won by a French
    company, from official TED data: buyer, country, subject, notice-level amount, CPV codes, official
    links, co-winners proven legal persons (other names and IDs counted by reason, never named). Identifier-matched
    only (SIREN/SIRET incl. spaced variants); coverage is eForms notices since 2023-10-25 above EU thresholds,
    and ~57% of award notices carry a usable identifier, so an empty list is not proof of absence. Complements
    get_french_company_public_procurement (French DECP, below-threshold). Paid via x402 ($0.02 in USDC
    or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_french_company_eu_funding
  description: 'EU research and innovation funding received by a French company, from CORDIS (European
    Commission, CC BY 4.0): every Horizon 2020 (2014-2020) and Horizon Europe (2021-2027) project the
    company appears in — role (coordinateur, participant, partenaire_associe, tiers…), EU contribution,
    total cost, dates, project status (signe / clos / termine) and the official CORDIS link — plus totals
    (projects, EU contribution in EUR, projects under way). The company is matched by the VAT number CORDIS
    publishes (about 90% of French participations carry a readable one): `aucun_financement: true` is
    a NON-conclusive absence, never “never funded”. Facts only, no score. Paid via x402 ($0.02 in USDC
    or EURC). When you report a result, cite its `citation` verbatim.'
- name: get_french_company_lobbying
  description: 'Lobbying and transparency profile of a French company from the official HATVP register
    of interest representatives: registration status, category, lobbying-expense brackets per year, recent
    subjects with intervention domains, clients (for consulting firms), affiliations, declaration defaults.
    Organisation-level only — no personal data. `inscrit: false` is a meaningful answer. Paid via x402
    ($0.01 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
- name: check_french_regulator_alerts
  description: 'French financial regulator (AMF) alerts and registers — scam check: screen a name against
    the official AMF blacklists (unauthorized investment websites, scams, AMF impersonation) and look
    up PSAN crypto-provider registrations and licensed asset-management companies (SGP) by name or SIREN.
    Use before trusting an investment site, a crypto provider or an asset manager operating in France.
    Official AMF open data, refreshed daily. Paid via x402 ($0.01 in USDC or EURC). When you report a
    result, cite its `citation` verbatim.'
  category: compliance
  rest: /v1/regulateurs/fr/alertes
- name: search_eu_financial_authorisations
  description: 'Search EU financial authorisations in five official registers by name or LEI: ESMA Registers
    (MiFID-regulated entities across all EU/EEA countries: status, home and host member states, competent
    authority, dates), the ECB list of supervised entities (`supervision_bce`: banking union, significant
    banks under direct ECB supervision and less significant ones under national authorities, group, remarks,
    monthly changes; absence is conclusive only for a LEI and never means unsupervised outside the banking
    union), the ESMA register of benchmark administrators (`administrateurs_indices`), the ESMA register
    of money market funds (`fonds_monetaires`: fund and manager LEI, type, domicile, authorisation status
    incl. Withdrawn, dates) and the EIOPA register of occupational pension institutions (`iorp`: national
    authority, registration dates incl. closed registrations, cross-border activity, managing entity;
    only 30% carry a LEI, so zero by LEI is never conclusive). A block listed in `blocs_absents` could
    not be read. Use to verify that a financial firm is actually regulated somewhere in the EU. Data freely
    available at the sources. Paid via x402 ($0.01 in USDC or EURC). When you report a result, cite its
    `citation` verbatim.'
- name: validate_eu_vat_number
  description: 'VAT number check against VIES: use when you only need the tax half of verifying a supplier
    before payment: confirm that a counterparty''s intra-community VAT number really exists before invoicing
    it, applying the reverse charge or paying it. It is a required check under the French e-invoicing
    mandate of 1 September 2026 and under the Belgian B2B mandate in force since 1 January 2026. Validates
    any EU intra-community VAT number against the official VIES service (all member states) and returns
    valid or invalid, the registered name and address when the member state publishes them, and the VIES
    consultation identifier as proof. Name and address are served only for a holder that its number''s
    format or its country''s register (BE, PL, LV, HR, RO, SE, CZ, DK, FI, FR) proves a legal person;
    any other holder (natural person, undecided form, missing from its register, or in a state where no
    register qualifies it: AT, CY, DE, EE, EL, HU, IE, IT, LT, LU, MT, NL, SI, SK, XI) gets neither, the
    omission counted in ecartes by reason. A VIES outage (member state down or saturated) returns error
    503 amont_indisponible, not charged: retry later; never a false invalid. The response is Ed25519-signed
    and carries provenance[]: the VIES entry with the date the number was really consulted, never a fabricated
    one. Paid via x402 ($0.003 in USDC or EURC). When you report a result, cite its `citation` verbatim.'
  category: invoicing
  rest: /v1/tva/verifier/{numero}
