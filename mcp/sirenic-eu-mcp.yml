payment:
  protocol: x402
  network: eip155:8453
  asset: USDC
  assets:
  - symbol: USDC
    contract: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
  - symbol: EURC
    contract: '0x60a3E35Cc302bFA44Cb288Bc5a4F316Fdb1adb42'
  api_key_alternative:
    argument: api_key
    key_format: srn_live_…
    unit: 1 credit = 1 EUR, same per-call prices
    validity: credits expire 12 months after purchase; the ones closest to expiry are spent first
    signup: https://api.sirenic.eu/compte
    free_quota: 150 calls/month on routes <= $0.05 with a verified account
client_configs:
