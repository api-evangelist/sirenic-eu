description: 'Can you safely invoice or pay this company? Verify a supplier before payment in one call — legal identity,
  VAT checked live against VIES, IBAN form-checked with its bank identified from official registries, and a deterministic
  ready-to-invoice verdict (French e-invoicing mandate: 1 September 2026; Belgium since 1 January 2026; Poland''s
  White List account check). Plus French & European company data for AI agents: France in depth (INSEE Sirene /
  INPI RNE) with profiles, officers, financials, share capital, default scoring, sanctions screening and documents;
  European search & profiles (Belgium, Switzerland, UK, Norway, Estonia, Latvia, Czechia, Slovakia, Finland, Poland),
  Spanish registry acts (BORME) and worldwide entities via LEI/GLEIF. Paid per call in USDC or EURC via the x402
  protocol. Start for free: suggest_company_names turns a French company name into its SIREN (no account, no API
  key, no payment).'
deployment:
