  /v1/entreprise/{siren}/sante:
    get:
      summary: Business-health risk read-out (FR + EN, closed grid, official data only)
      x-price: $0.15
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - $ref: '#/components/parameters/siren'
      responses:
        '200':
          description: 'Risk read-out from official data: `synthese` (resume FR + resume_en, strengths, warning signs, missing data, verdict, activity trend, confidence level), `grille` (the reconciled evaluation grid, machine-readable codes) and `divergences_modele` (where deterministic guards overruled the model). A model only picks values from closed lists: no free text, no name and no figure of its own. WHAT TO EXPECT ON THIN FILES: entities that file no annual accounts — non-profits, sole traders, companies under a year old, ceased companies — return `verdict: "non_concluant"` with most grid fields set to `non_evaluable`; the prose then states explicitly that no accounts are available and whether that is normal at this age, and a ceased company is flagged with the `entreprise_administrativement_fermee` warning. Measured on a random sample of 47 SIREN: half of them are such files. Includes model, prompt version and cache status. Cached 7 days.'
          content:
            application/json:
              example:
                siren: '552032534'
                synthese:
                  points_forts:
                  - Résultats nets positifs récurrents
                  points_vigilance:
                  - Ratios incohérents dans la source officielle
                  donnees_manquantes:
                  - Structure du passif
                  verdict: sous_reserve
                  tendance_activite: croissance
                  niveau_confiance: faible
                grille:
                  verdict: sous_reserve
                  ca_tendance: croissance_forte
                  ca_regularite: irreguliere
                  rentabilite_niveau: forte
                  rentabilite_tendance: volatile
                  endettement_niveau: eleve
                  endettement_tendance: alourdissement
                  autonomie_financiere: correcte
                  liquidite: echelle_non_etablie
                  capacite_remboursement: correcte
                  bfr_exploitation: atypique_negatif
                  structure_synthese: equilibree
                  points_forts:
                  - resultats_nets_positifs_recurrents
                  points_vigilance:
                  - ratios_incoherents
                  confiance_niveau: faible
                  confiance_motifs:
                  - incoherences_detectees
                  donnees_manquantes:
                  - structure_du_passif
                divergences_modele:
                - 'correspondance de criblage : verdict contraste -> sous_reserve'
                modele: claude-sonnet-5
                version_prompt: sante-v2
                genere_le: '2026-08-11T07:51:02.474Z'
                donnees:
                  score_completude: 100
                  data_freshness: 'identité : stock Sirene mensuel (2026-07-01)'
                depuis_cache: true
        '400':
          $ref: '#/components/responses/Reponse400InvalidInput'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: No diffusible company for this SIREN.
      tags:
      - Entreprise
      operationId: getV1EntrepriseBySirenSante
      x-operation-id-source: derived
  /v1/entreprise/{siren}/capital:
