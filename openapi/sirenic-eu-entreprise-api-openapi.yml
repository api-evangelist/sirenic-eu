      summary: Rival contractors on the same CPV segments (public procurement)
      x-price: $0.02
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - name: siren
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d{9}$
        example: '130031487'
      responses:
        '200':
          description: The company's top-5 CPV segments (last 5 years) and the top-15 rival contractors on those segments over the last 3 years, with contract counts, total amounts and shared segments.
          content:
            application/json:
              example:
                siren: '130031487'
                segments_cpv:
                - cpv4: '7999'
                  nombre: 7
                - cpv4: '8053'
                  nombre: 4
                periode_comparaison_annees: 3
