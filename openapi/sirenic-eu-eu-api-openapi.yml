      description: 'Official Belgian company registry lookup (KBO/BCE, Banque-Carrefour des Entreprises / Kruispuntbank van Ondernemingen). Query: /v1/eu/entreprise/BE/0403199702 (10-digit enterprise number, with or without dots). Returns legal name, legal form, normalized status, incorporation date, registered office, NACEBEL activities with French labels, the establishment-unit list, VAT number and LEI, plus a link to the official register entry — Belgian company data from KBO/BCE open data, refreshed daily.'
      x-price: $0.01
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9.-]{1,20}$
        example: '0403170701'
        description: National register identifier for BE.
      x-exemple-partage: /v1/eu/entreprise/{pays}/{id}
      responses:
        '200':
          $ref: '#/components/responses/Reponse200UnifiedJson'
        '400':
          $ref: '#/components/responses/Reponse400InvalidInput'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: No diffusible company for this SIREN.
        '503':
          $ref: '#/components/responses/Reponse503LocalRegister'
      tags:
      - Eu
      operationId: getV1EuEntrepriseBEById
      x-operation-id-source: derived
    servers:
    - url: https://api.sirenic.eu
