  /v1/eu/entreprise/CY/{id}:
    get:
      summary: Cypriot company profile (Registrar of Companies DRCOR — monthly snapshot of…
      description: 'Official Cypriot company registry lookup (Registrar of Companies, DRCOR — monthly open-data snapshot on data.gov.cy, CC BY 4.0). Query: /v1/eu/entreprise/CY/HE165 (number with its HE or AE prefix; business names, partnerships and BN are not legal persons and are not served). Current name, type and sub-type, one of 12 dated register statuses (registered, struck off, liquidation, receivership…), registration date, registered office, plus registre_cy (status family, mandates count).'
      x-price: $0.01
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^(HE|AE)\d{1,7}$
        example: HE165
        description: 'Registration number with its prefix: HE (company) or AE (overseas company); Greek homograph letters and a space are accepted and canonicalised'
      responses:
        '200':
          description: Unified profile (current name, type and sub-type as legal form, normalised status with the register status detail, registration date, registered office, LEI) plus `registre_cy` (type, sub-type, status with closed-list family and date, procedure_au_registre, registered office parts, mandates count, nom_courant_seul), `groupe_lei`, `financements_ue`, `provenance`.
          content:
            application/json:
              example:
                pays: CY
                registre: Department of the Registrar of Companies and Intellectual Property (DRCOR, Τμήμα Εφόρου Εταιρειών)
                id_national: HE165
                denomination: BANK OF CYPRUS PUBLIC COMPANY LIMITED
                forme_juridique:
                  code: HE
                  libelle: Εταιρεία — Δημόσια
                statut: actif
                statut_detail: null
                date_creation: '1943-12-31'
                adresse_siege:
                  adresse: Στασίνου, 51
                  code_postal: '2002'
                  ville: Στρόβολος
                  pays: CY
                identifiants:
                  tva: null
                  lei: null
                registre_cy:
                  statut: servi
                  photo: '2026-09-08'
                  type:
                    code: HE
                    prefixe: ΗΕ
                    libelle_el: Εταιρεία
                    fr: société
                  numero_registre: 165
                  sous_type:
                    libelle_el: Δημόσια
                    code: publique
                  etat:
                    libelle_el: Εγγεγραμμένη
                    famille: aucun
                    fr: inscrite
                    depuis: null
                  procedure_au_registre: false
                  inscrit_le: '1943-12-31'
                  siege:
                    ligne: Στασίνου, 51
                    territoire: Αγία Παρασκευή, Στρόβολος, 2002, Λευκωσία, Κύπρος
                    code_postal: '2002'
                    ville: Στρόβολος
                    pays_libelle: Κύπρος
                  mandats_publies: 12
                  nom_courant_seul: true
        '400':
          description: 'Invalid number (not HE/AE + digits), or a business name / partnership / BN (type_non_servi: not legal persons) — payment not taken. Never charged. / Jamais facturé.'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: Unknown number in the monthly snapshot (registered and struck-off companies are both published) — payment cancelled.
        '503':
          description: Monthly snapshot not yet loaded or older than 45 days (fail-closed) — payment cancelled.
      tags:
      - Eu
      operationId: getV1EuEntrepriseCYById
      x-operation-id-source: derived
    servers:
    - url: https://api.sirenic.eu
