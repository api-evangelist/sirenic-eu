  /v1/eu/facturation/dossier:
    get:
      summary: Verify a supplier before payment — Belgium & Poland (incl.
      description: 'European invoice verification and supplier verification for e-invoicing compliance in Belgium (mandate live since 1 Jan 2026) and Poland (KSeF): official registry identity, VAT check against VIES, Peppol reachability (BE), IBAN form + key check, bank identified and, in Poland, the official White List: is the IBAN DECLARED by the taxpayer? Paying an undeclared account over 15,000 PLN costs the buyer the VAT deduction and joint liability. Deterministic pret_a_facturer verdict, closed-list reasons.'
      x-price: $0.03
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - name: pays
        in: query
        required: true
        schema:
          type: string
          enum:
          - BE
          - PL
        example: BE
        description: Belgium or Poland (for France use /v1/facturation/dossier)
      - name: id
        in: query
        required: true
        schema:
          type: string
        example: 0403199702
        description: Belgian enterprise number or Polish NIP (10 digits)
      - name: iban
        in: query
        required: false
        schema:
          type: string
        description: Payee IBAN — optional; form check (structure + key) plus bank identification, and in Poland it unlocks the White List account check
      responses:
        '200':
          description: Registry identity, VAT number checked against VIES, Peppol reachability (BE), White List status and account check (PL), IBAN form check + bank identification, mandate calendar, and a deterministic pret_a_facturer verdict whose reasons are a closed list, each classified blocking or informational and traced to its source. With an iban supplied, verdict.non_verifie sits NEXT TO the verdict and names what is never checked (account existence, holder name) — the Polish White List proves the account is DECLARED by that taxpayer, not who holds it. An unavailable source yields `non vérifiable`, never a false `invalid`. Also carries provenance[] — official register, licence and as_of date per block; the Polish account check restitutes the exact `date` sent to the White List, which is the date the buyer can rely on.
          content:
            application/json:
              example:
                pays: BE
                id: 0403199702
                destinataire:
                  denomination: BNP Paribas Fortis
                  etat: null
                tva:
                  numero: BE0403199702
                  statut: valide
                peppol:
                  joignable: true
                  identifiant: 0208:0403199702
                  nom_enregistre: BNP Paribas Fortis NV
                  documents:
                  - Invoice
                  accepte_facture_en16931: true
                banque: null
                mandat:
                  obligation: facturation électronique structurée entre assujettis
                  en_vigueur_depuis: '2026-01-01'
                  canal_par_defaut: Peppol (art. 13ter, présomption réfragable)
                verdict:
                  pret_a_facturer: true
                  raisons:
                  - code: iban_non_fourni
                    niveau: information
                    source: Paramètre `iban` absent — contrôle bancaire non effectué.
                source: Banque-Carrefour des Entreprises (BCE/KBO), VIES (Commission européenne), annuaire Peppol, registres bancaires officiels.
