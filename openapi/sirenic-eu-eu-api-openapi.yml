openapi: 3.2.0
info:
  title: Sirenic Eu API
  version: 1.0.0
  contact:
    email: contact@sirenic.eu
  license:
    name: 'Data: Licence Ouverte / Open License Etalab 2.0'
    url: https://www.etalab.gouv.fr/licence-ouverte-open-licence/
  description: 'Operations tagged Eu across 2 of this provider''s published API definitions: sirenic-eu-openapi.json, sirenic-eu-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sirenic.eu
security:
- {}
- ApiKeyAuth: []
- BearerAuth: []
tags:
- name: Eu
paths:
  /v1/eu/recherche:
    get:
      summary: Search European companies across official registers (unified schema)
      x-price: $0.003
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        example: equinor
        description: Company name — 2 to 100 characters once unsupported characters are stripped.
      - name: pays
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
        example: 'NO'
        description: Optional ISO-3166 alpha-2 country filter
      responses:
        '200':
          description: 'Top 10 matches with country, national ID, name, normalized status, city, source register (local registers + worldwide GLEIF) and score_confiance (0-1 match confidence). Registers are queried in PARALLEL, each under a time budget: any register that stays silent is REPORTED in registres_muets (empty array = every queried register answered) — a silent miss is never served as an empty result. If every register is silent, the call is a 503 and nothing is charged.'
          content:
            application/json:
              example:
                nombre_resultats: 10
                registres_muets: []
                resultats:
                - pays: 'NO'
                  id_national: '923609016'
                  denomination: EQUINOR ASA
                  statut: actif
                  ville: STAVANGER
                  registre: Enhetsregisteret (Brønnøysundregistrene)
                  correspondance: registre_local
                  score_confiance: 1
                pays_couverts:
                - pays: 'NO'
                  registre: Enhetsregisteret (Brønnøysundregistrene)
                  mode: base locale
                  entites: 1168483
                source: 'Registres officiels : Brønnøysundregistrene (NO, NLOD), e-Business Register (EE, CC-BY 4.0), Uzņēmumu reģistrs (LV), KBO/BCE (BE), CVR (DK), Companies House (GB, OGL), ARES (CZ), Register právnických osôb (SK, CC-BY 4.0), PRH/YTJ (FI, CC-BY 4.0), Krajowy Rejestr Sądowy (PL), Zefix (CH, OGD), Bolagsverket (SE), GLEIF (CC0)'
                disclaimer: Données rediffusées telles que publiées par les registres officiels, dans un schéma unifié ; `statut` est une normalisation en 3 valeurs, le libellé source est conservé dans `statut_detail`. / Official register data as published, unified schema; `statut` is a 3-value normalization.
        '400':
          $ref: '#/components/responses/Reponse400InvalidInput'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: No diffusible company for this SIREN.
        '503':
          $ref: '#/components/responses/Reponse503LocalRegister'
      tags:
      - Eu
      operationId: getV1EuRecherche
      x-operation-id-source: derived
    servers:
    - url: https://api.sirenic.eu
  /v1/eu/entreprise/{pays}/{id}:
    get:
      summary: Unified European company profile
      x-price: $0.01
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - name: pays
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
        example: 'NO'
        description: ISO-3166 alpha-2 country code (NO, EE, LV, BE, CH, CZ, SK, FI, PL; DK/GB when enabled)
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9.-]{1,20}$
        example: '923609016'
        description: National register identifier
      responses:
        '200':
          description: 'Same JSON schema for every country: identity, legal form, normalized status (+ source label), creation date, head office, VAT, LEI, official register link, data freshness. Belgian profiles also carry NACEBEL activities (French labels) and the establishment-unit list. Every profile carries groupe_lei (GLEIF level-2: direct and ultimate consolidating parents with lei, denomination, pays and the declared relationship, or absence_mere with the declared reason; declaration = relation | exception | aucune; sans_objet without a LEI; indisponible marker when the daily golden copy is missing or stale — never a 503 for this block), and financements_ue (CORDIS: Horizon 2020 / Horizon Europe projects matched by the published VAT number for BE, DK, FI, SE, CZ, CH, NO and LV profiles — totals, five most recent projects, partial coverage; sans_objet elsewhere). Plus score_defaillance (statut non_evaluable + closed-list reasons: no default-risk score outside France — see GET /v1/lecture).'
          content:
            application/json:
              example:
                pays: GB
                registre: Companies House
                id_national: '00000006'
                lei: null
                denomination: MARINE AND GENERAL MUTUAL LIFE ASSURANCE SOCIETY
                forme_juridique:
                  code: private-unlimited-nsc
                  libelle: null
                statut: cesse
                statut_detail: dissolved
                date_creation: '1862-10-25'
                adresse_siege:
                  adresse: Cms Cameron Mckenna Llp Cannon Place
                  code_postal: EC4N 6AF
                  ville: London
                  pays: GB
                activite:
                  nomenclature: SIC-2007
                  code: '65110'
                  libelle: null
                identifiants:
                  tva: null
                  lei: null
                lien_registre: https://find-and-update.company-information.service.gov.uk/company/00000006
                data_freshness: Companies House temps réel (cache 24 h)
                source: 'Registres officiels : Brønnøysundregistrene (NO, NLOD), e-Business Register (EE, CC-BY 4.0), Uzņēmumu reģistrs (LV), KBO/BCE (BE), CVR (DK), Companies House (GB, OGL), ARES (CZ), Register právnických osôb (SK, CC-BY 4.0), PRH/YTJ (FI, CC-BY 4.0), Krajowy Rejestr Sądowy (PL), Zefix (CH, OGD), Bolagsverket (SE), GLEIF (CC0)'
                disclaimer: Données rediffusées telles que publiées par les registres officiels, dans un schéma unifié ; `statut` est une normalisation en 3 valeurs, le libellé source est conservé dans `statut_detail`. / Official register data as published, unified schema; `statut` is a 3-value normalization.
        '400':
          $ref: '#/components/responses/Reponse400InvalidInput'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: No diffusible company for this SIREN.
        '503':
          $ref: '#/components/responses/Reponse503LocalRegister'
      tags:
      - Eu
      operationId: getV1EuEntrepriseByPaysById
      x-operation-id-source: derived
    servers:
    - url: https://api.sirenic.eu
  /v1/eu/entreprise/BE/{id}:
