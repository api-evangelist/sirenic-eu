          type: string
          pattern: ^\d{10}$
        example: 0000006865
        description: 10-digit KRS number, leading zeros included
      responses:
        '200':
          description: 'Registry events, newest first, each with the bulletin day it appeared on (`constate_le`), the register''s own date when published (`date_source`, else null — `date_source_inferee: true` when that date was inferred from its format alone), the register section and a structured detail. `observation` states the collected window, which is contiguous by construction, and no event outside it is ever served; `aucun_evenement: true` is an explicit positive answer INSIDE that window only. The `existence` block states whether the KRS was actually read during the window — this endpoint does not otherwise check that the number exists, and an unknown number returns the same empty answer (settle it with GET /v1/eu/entreprise/PL/{krs}). `retard_jours` gives the age of the window. Never an officer, a shareholder or a PESEL — and never the register''s free-text wording: it is read to extract a date, then discarded. `autorite` carries the deciding court or authority (an institution),
