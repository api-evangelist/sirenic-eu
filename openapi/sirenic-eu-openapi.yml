                retard_jours: 1
                source: Krajowy Rejestr Sądowy (KRS) — Ministerstwo Sprawiedliwości, API ouverte api-krs.ms.gov.pl (Biuletyn quotidien + OdpisAktualny)
                licence: Données publiques du Krajowy Rejestr Sądowy (Ministerstwo Sprawiedliwości, api-krs.ms.gov.pl), réutilisation libre
