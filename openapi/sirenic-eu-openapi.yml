openapi: 3.1.0
info:
  title: Sirenic API
  version: 1.0.0
  description: 'French & European company data, pay-per-call in USDC or EURC — EURC at numeric parity: the same figure as the USDC price, not FX-converted (at the ECB rate of 4 Sept 2026, about 16 % more in dollar terms) via the x402 protocol — or with an API key and prepaid credits (1 credit = 1 EUR, same per-call prices, no wallet). France in depth plus European search & profiles (BE, CH, UK, NO, EE, LV, CZ, SK, FI, PL), Spanish BORME registry acts (ES, by hoja), Belgian, Finnish and Norwegian annual accounts, and large groups worldwide via LEI/GLEIF. Source: INSEE Sirene / INPI RNE via recherche-entreprises.api.gouv.fr (Etalab 2.0). Payment: x402, network eip155:8453, assets USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 or EURC 0x60a3E35Cc302bFA44Cb288Bc5a4F316Fdb1adb42 (same numeric amount in either). API key: send X-Api-Key: srn_live_… (or Authorization: Bearer srn_live_…) on any /v1 call; the response carries X-Credits-Charged and X-Credits-Remaining. Create an account and keys at
    /compte. A signed x402 payment always takes precedence over a key. Toute réponse non-2xx (400, 402, 404, 5xx) n''est jamais facturée : le paiement x402 est annulé avant règlement — le transfert n''a pas lieu, il n''y a donc rien à rembourser. / Any non-2xx response is never charged: the x402 payment is cancelled before settlement — the transfer never happens, so there is nothing to refund.'
  contact:
    email: contact@sirenic.eu
  license:
    name: 'Data: Licence Ouverte / Open License Etalab 2.0'
    url: https://www.etalab.gouv.fr/licence-ouverte-open-licence/
servers:
- url: https://api.sirenic.eu
components:
  parameters:
    siren:
      in: path
      name: siren
      required: true
      schema:
        type: string
        pattern: ^\d{9}$
      example: '552032534'
      description: 9-digit SIREN (Luhn-validated)
  responses:
    Reponse400InvalidInput:
      description: 'Invalid input. Body: {error, champ, message}. Never charged. / Jamais facturé.'
    Reponse402PaymentRequired:
      description: Payment required — x402 payment requirements in body (JSON) and headers.
    Reponse503LocalRegister:
      description: 'Local register not yet collected (`collecte_en_cours`), or its snapshot older than that country''s freshness threshold (`photo_perimee` — Sweden: 21 days, matching the guard on Swedish events). A stale snapshot cannot assert a company''s current status. Payment not settled; retrying does not help.'
    Reponse200UnifiedJson:
      description: 'Same unified JSON schema as /v1/eu/entreprise/{pays}/{id} (see its response example): identity, legal form, normalized status, creation date, head office, VAT, LEI, official register link, data freshness.'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 'Sirenic API key (srn_live_…) paying with prepaid credits (1 credit = 1 EUR, same prices as x402). Credits expire 12 months after purchase; calls are charged first to the credits closest to expiry. Optional: without it, the same routes answer 402 with a signable x402 quote. Insufficient balance → 402 {error: credits_insuffisants} WITHOUT a PAYMENT-REQUIRED header. Get a key at /compte.'
    BearerAuth:
      type: http
      scheme: bearer
      description: 'The same srn_live_… API key sent as Authorization: Bearer. A bearer value that is not an srn_ key is ignored (x402 flow unchanged).'
security:
- {}
- ApiKeyAuth: []
- BearerAuth: []
paths:
  /v1/recherche:
    get:
      summary: Search French companies by name or SIREN (top 10)
      description: 'French company search and company lookup by name or SIREN in the official French company registry (INSEE Sirene / INPI RNE open data). Name search returns the top 10 matches with identity, SIREN, NAF code, city and active/ceased status, plus a score_confiance (0-1 match confidence) that helps disambiguate homonyms. The entry point to official data and company data on France: resolve a trading name to its SIREN identifier before pulling the full company profile, filings or financials.'
      x-price: $0.002
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        example: danone
        description: 'Company name, or a French identifier (SIREN, SIRET, VAT) — spaced or labelled ("SIREN : 552 032 534") resolves directly. Unsupported characters are stripped, not rejected; 400 only if nothing searchable is left (1-100 chars once cleaned).'
      responses:
        '200':
          description: 'Top 10 matches with identity, SIREN, NAF, city, status and score_confiance (0-1 match confidence). When no result actually resembles the query (best confidence < 0.5), the body carries aucune_correspondance_fiable: true and a bilingual note_correspondance — the registry''s closest guesses are still listed, but they are not the company you asked for. Served from the local Sirene index; if an index stage is abandoned (time budget exceeded or query error), the call falls back to the real-time registry API (data_freshness says so). Only when that fallback fails too is a partial answer served — flagged by resultats_partiels: true and the abandoned stage named in etages_abandonnes (always present; empty array = complete top 10). A degraded answer is never sold as complete.'
          content:
            application/json:
              example:
                total_results: 10
                resultats:
                - siren: '552032534'
                  denomination: DANONE
                  statut_diffusion: totale
                  etat_administratif: actif
                  activite_principale: 70.10Z
                  commune_siege: PARIS
                  code_postal_siege: '75009'
                  score_confiance: 1
                source: INSEE Sirene / INPI RNE via recherche-entreprises.api.gouv.fr, licence ouverte Etalab 2.0
                disclaimer: Données issues de l'open data, fournies en l'état sans garantie. / Open data, provided as is without warranty.
                etages_abandonnes: []
                data_freshness: stock Sirene mensuel (2026-08-01), dirigeants temps réel
        '400':
          $ref: '#/components/responses/Reponse400InvalidInput'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: No diffusible company for this SIREN.
        '503':
          description: 'The local index was degraded (a stage abandoned under its time budget or on a query error) and returned nothing, AND the real-time registry is unavailable (error: recherche_indisponible) — or the local stock is absent and the registry is down (error: amont_indisponible). Nothing is charged, retry in a few seconds.'
  /v1/entreprise/{siren}:
    get:
      summary: Full company profile by SIREN
      description: 'Full French company profile by SIREN: official company data from the French company registry (INSEE Sirene / INPI RNE). One lookup returns legal name, legal form, head office, NAF code, workforce bracket, creation date, active or ceased status, officers with name and role, collective agreement, the intra-EU VAT number and, for LEI holders, the GLEIF level-2 group (groupe_lei: consolidating parents or declared reason for none). The core KYB building block for verifying a French counterparty.'
      x-price: $0.005
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - $ref: '#/components/parameters/siren'
      - name: geo
        in: query
        required: false
        schema:
          type: boolean
        description: true = include GPS coordinates (WGS84) of establishments
      responses:
        '200':
          description: 'Full profile: legal name, legal form, head office, NAF, workforce, officers, collective agreements (conventions_collectives, plus conventions_collectives_notes reading out technical IDCC codes such as 9999 = no agreement assigned), VAT number, plus groupe_lei (GLEIF level-2: direct and ultimate consolidating parents with lei, denomination, pays and the declared relationship, or absence_mere with the declared reason; declaration = relation | exception | aucune; sans_objet without a LEI; indisponible marker when the daily golden copy is missing or stale — never a 503 for this block).'
          content:
            application/json:
              example:
                siren: '552032534'
                denomination: DANONE
                nature_juridique: '5599'
                activite_principale: 70.10Z
                categorie_entreprise: GE
                tranche_effectif_salarie: '42'
                date_creation: '1955-01-01'
                etat_administratif: actif
                siege:
                  siret: '55203253400703'
                  adresse: 59 RUE LA FAYETTE 75009 PARIS
                  code_postal: '75009'
                  commune: PARIS
                dirigeants:
                - type: personne_morale
                  siren: '344366315'
                  denomination: ERNST & YOUNG AUDIT
                  fonction: Commissaire aux comptes titulaire
                tva_intracommunautaire: FR27552032534
                nombre_etablissements: 19
                index_egapro:
                - annee: 2025
                  note: 86
                source: INSEE Sirene / INPI RNE via recherche-entreprises.api.gouv.fr, licence ouverte Etalab 2.0 ; index Egapro (ministère du Travail) et annuaire RGE (ADEME), licence ouverte Etalab 2.0
                data_freshness: stock Sirene mensuel (2026-07-01), dirigeants temps réel
        '400':
          $ref: '#/components/responses/Reponse400InvalidInput'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: No diffusible company for this SIREN.
  /v1/entreprise/{siren}/etablissements:
    get:
      summary: List establishments (SIRET) of a company
      description: 'All establishments (SIRET) of a French company: the complete list of business locations registered under one SIREN, official data from the French company registry (INSEE Sirene), head office and branches alike, each with its address and open or closed status. Use it to map the branches and addresses of a company across France, or to check whether a given SIRET is still open. The SIREN identifies the legal entity; the SIRET identifies each of its establishments.'
      x-price: $0.003
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - $ref: '#/components/parameters/siren'
      responses:
        '200':
          description: Establishments with addresses and open/closed status.
          content:
            application/json:
              example:
                siren: '552032534'
                denomination: DANONE
                nombre_etablissements: 19
                etablissements:
                - siret: '55203253400703'
                  est_siege: true
                  adresse: 59 RUE LA FAYETTE 75009 PARIS
                  code_postal: '75009'
                  commune: PARIS
                  etat_administratif: actif
                  activite_principale: 70.10Z
                  date_creation: '2025-08-19'
                  date_fermeture: null
                  enseignes: []
                  tranche_effectif_salarie: NN
                source: INSEE Sirene / INPI RNE via recherche-entreprises.api.gouv.fr, licence ouverte Etalab 2.0
                disclaimer: Données issues de l'open data, fournies en l'état sans garantie. / Open data, provided as is without warranty.
                data_freshness: stock Sirene mensuel (2026-07-01), dirigeants temps réel
        '400':
          $ref: '#/components/responses/Reponse400InvalidInput'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: No diffusible company for this SIREN.
  /v1/entreprise/{siren}/alertes:
    get:
      summary: Legal alerts from BODACC (insolvency, deregistration, business sales)
      x-price: $0.01
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - $ref: '#/components/parameters/siren'
      responses:
        '200':
          description: 'Announcements grouped by family (procedures collectives, radiations, ventes/cessions), most recent first, with judgment details. Each announcement carries `role`: `sujet` (this company is the debtor), `partie_citee` or `indetermine`. Since 2026-09-04, insolvency notices of ANOTHER company that merely cite this one as a party (creditor bank, counterparty) are served apart in `mentions_comme_partie` with the real debtor''s name (`sujet_annonce`), and count towards NO verdict — a creditor listed in a debtor''s conciliation judgment used to be scored as if it were in proceedings itself. `denomination` is the Sirene legal name (`denomination_source`), never the trade label of the latest notice.'
          content:
            application/json:
              example:
                siren: '552032534'
                denomination: DANONE
                procedures_collectives: []
                radiations: []
                ventes_cessions: []
                autres_annonces:
                  Modifications diverses: 63
                  Dépôts des comptes: 37
                total_annonces: 106
                consulte_le: '2026-07-29T07:28:49.560Z'
                source: BODACC (DILA) via bodacc-datadila.opendatasoft.com, licence ouverte Etalab 2.0
                disclaimer: Annonces officielles telles que publiées ; les avis rectificatifs et annulations sont restitués avec leur type, sans fusion. / Official announcements as published; rectifications and cancellations carry their type.
                data_freshness: BODACC temps réel (API DILA), cache 24 h
        '400':
          $ref: '#/components/responses/Reponse400InvalidInput'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: No diffusible company for this SIREN.
  /v1/entreprise/{siren}/contentieux:
    get:
      summary: Commercial-court decisions linked to the company (Judilibre open data)
      x-price: $0.01
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - $ref: '#/components/parameters/siren'
      responses:
        '200':
          description: 'Commercial-court decisions linked to the SIREN, most recent first (100 max, `tronque` beyond): court and code, date, docket number, closed-list `nature` and `role`, the other legal entities involved (SIREN + Sirene name), `redondante_bodacc` for insolvency judgments already served by /alertes, and the official Judilibre URL. Plus counts, the measured coverage (61.8% of decisions carry a usable identifier) and the source update date. Never a text, a natural person''s name or an amount.'
          content:
            application/json:
              example:
                siren: '552032534'
                denomination: DANONE
                exhaustivite: partielle
                avertissement: Une absence de résultat ne vaut pas absence de contentieux.
                synthese:
                  nombre_decisions: 1
                  par_nature:
                    condamnation_ou_injonction_a_payer: 1
                decisions:
                - id_judilibre: 69f4703ccdc6046d4731b4af
                  date: '2026-04-30'
                  juridiction: Tribunal de commerce d'Orléans
                  nature: condamnation_ou_injonction_a_payer
                  role: demandeur
                  mode_rattachement: identifiant_etiquete
                  confiance: certain
                  url_officielle: https://www.courdecassation.fr/decision/69f4703ccdc6046d4731b4af
                tronque: false
                source: 'Cour de cassation — base Judilibre (open data, source juritcom), Licence Ouverte 2.0 ; dernière mise à jour de notre stock : 2026-09-10.'
                consulte_le: '2026-09-10T11:44:00Z'
                disclaimer: Liens décision ↔ société par identifiant RCS/SIREN ; couverture partielle mesurée ; aucune donnée de personne physique. / Partial measured coverage; no natural-person data.
                data_freshness: 'stock Judilibre tcom collecté quotidiennement (dernier passage réussi : 2026-09-10) ; identité Sirene'
        '400':
          description: 'Sole proprietorship (`entreprise_individuelle_non_couverte`) or restricted diffusion (`diffusion_partielle_non_couverte`): decisions are never linked to a natural person. Nothing is charged. Never charged. / Jamais facturé.'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: No diffusible company for this SIREN.
        '503':
          description: Judilibre stock not built yet (`collecte_en_cours`) or older than 7 days (`photo_perimee`). Nothing is charged.
  /v1/entreprise/{siren}/accords-collectifs:
    get:
      summary: Company-level collective agreements published on Légifrance (ACCO fund)
      x-price: $0.02
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - $ref: '#/components/parameters/siren'
      responses:
        '200':
          description: 'Agreements, amendments and decisions published on Légifrance for the company, most recent first (100 max, `tronque` beyond): nature, title (masked when it names a person), DILA themes, signature / effect / end dates, IDCC, signatory unions, official link; `synthese` (counts, per nature and theme, texts signed in the last 24 months, IDCC coherence with Sirene) and `couverture` (SIRETs searched, texts consulted). Metadata only, never the text.'
          content:
            application/json:
              example:
                siren: '335146965'
                synthese:
                  nombre_textes: 5
                  dernier_texte: '2025-12-30'
                  coherence_idcc: identique
                textes:
                - id: ACCOTEXT000053386910
                  nature: avenant
                  titre: AVENANT N°4 RENOUVELLEMENT ACCORD TELETRAVAIL
                  themes:
                  - Télétravail
                  date_signature: '2025-12-30'
                  url_legifrance: https://www.legifrance.gouv.fr/acco/id/ACCOTEXT000053386910
        '400':
          description: 'Sole proprietorship (`entreprise_individuelle_non_couverte`) or restricted diffusion (`diffusion_partielle_non_couverte`): agreements are never linked to a natural person. Never charged. Never charged. / Jamais facturé.'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: No diffusible company for this SIREN.
        '503':
          description: Légifrance API unavailable or not configured (`legifrance_non_configure`). Nothing is charged.
  /v1/entreprise/{siren}/finances:
    get:
      summary: Annual financial data from filed accounts (INPI / Banque de France ratios)
      x-price: $0.01
      x-payment:
        protocol: x402
        network: eip155:8453
      parameters:
      - $ref: '#/components/parameters/siren'
      responses:
        '200':
          description: 'Revenue, EBITDA, EBIT, net income and financial ratios per fiscal year (filed accounts; a confidential income statement is flagged, its balance sheet kept). Carries `decalage_analytique`: latest filing known at the register (INPI, live) vs latest year analysed, with a closed-list reason.'
          content:
            application/json:
              example:
                siren: '552032534'
                nombre_exercices: 8
                exercices:
                - date_cloture: '2017-12-31'
                  chiffre_affaires: 609000000
                  ebe: 609000000
                  resultat_net: 176000000
                  ratios:
                    taux_endettement: 4.982
                    autonomie_financiere: 40.738
                    marge_ebe: 100
                  qualite:
                    fiabilite: a_verifier
                    anomalies:
                    - ebe_non_calculable
                    champs_douteux:
                    - couverture_interets
                    - ebe
                    - marge_brute
                    - marge_ebe
                    champs_non_renseignes: []
                perimetre_comptable:
                  perimetre: social
                  double_depot_confirme: true
                controles_coherence:
                - code: ebe_non_calculable
                  portee: bloquante
                  exercices:
                  - '2017-12-31'
                comptes_consolides:
                  perimetre: consolide
                  nombre_exercices: 8
                  exercices:
                  - date_cloture: '2024-12-31'
                    chiffre_affaires: 27376000000
                    resultat_net: null
                    qualite:
                      fiabilite: exploitable
                      anomalies:
                      - resultat_net_non_calcule
                      - ratio_non_calcule
                      champs_douteux: []
                      champs_non_renseignes:
                      - ratio_liquidite
                      - resultat_net
                source: Ratios financiers INPI / Banque de France (comptes annuels déposés) via data.economie.gouv.fr, licence ouverte 2.0
                data_freshness: jeu ratios_inpi_bce du 2026-06-01
        '400':
          $ref: '#/components/responses/Reponse400InvalidInput'
        '402':
          $ref: '#/components/responses/Reponse402PaymentRequired'
        '404':
          description: No diffusible company for this SIREN.
  /v1/entreprise/{siren}/marches-publics:
