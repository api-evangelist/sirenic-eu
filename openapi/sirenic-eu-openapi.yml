                  depuis: '2026-07-01'
                  jusqu_au: '2026-07-28'
                aucun_evenement: true
                nombre_evenements: 0
                evenements: []
                derniere_observation: null
                existence:
                  verifiee: false
                  explication: 'Existence NON vérifiée : cette route ne lit que les journées du Biuletyn, et ce numéro n''y a jamais figuré pendant la fenêtre. `aucun_evenement: true` signifie « aucun changement publié pendant la fenêtre » — PAS « société existante restée calme » : un numéro inexistant donne exactement la même réponse. Pour trancher l''existence, appeler la fiche d''identité LIVE (elle rend 404 si le KRS n''existe pas). / Existence NOT verified: this route only reads the daily bulletin and this number never appeared in it during the window; an unknown number yields the very same answer. Use the live identity endpoint to settle existence (it returns 404 when the KRS does not exist).'
