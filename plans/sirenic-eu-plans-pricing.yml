pricing_page: https://api.sirenic.eu/offres
currency: USD (USDC) — EURC accepted at numeric parity (same figure, not FX-converted); prepaid credits 1 credit
  = 1 EUR at the same per-call figures
description: 'Sirenic has no tiers: it is a public per-call price grid, one price per route, read here from the
  provider''s own machine-readable manifests rather than a marketing page. 116 priced routes from $0.002 to $1.00
  per call; per-unit routes multiply (KYB batch per company, comparison per company, watchlists per target × duration).
  Two payment rails at identical prices: x402 (no account) or prepaid credits with an API key.'
plan_count: 3
plans:
- id: x402-pay-per-call
  name: Pay per call (x402, no account)
  type: usage-based
  price: per route, see price_grid
  billing_period: per call, settled on Base (eip155:8453) in USDC or EURC
  included_quota: none — free routes excepted
  overage: n/a
  limits: x402 client default cap $1.00 per payment (client-side); maxTimeoutSeconds 120 per quote
  notes: Only 2xx responses are settled.
- id: prepaid-credits
  name: API key + prepaid credits
  type: prepaid
  price: packs of 10 / 20 / 50 / 100 EUR (1 credit = 1 EUR), Stripe invoice included
  billing_period: credits valid 12 months from purchase; closest-to-expiry spent first; e-mail 30 days before expiry
  included_quota: 150 free calls per month on routes priced ≤ $0.05 with a verified account
  overage: 402 credits_insuffisants when the balance is exhausted
  limits: same per-call prices as x402
  signup: https://api.sirenic.eu/compte
- id: free
  name: Free routes
  type: free
  price: $0
  included_quota: /v1/suggestions 2,000 calls/day/IP (60/min); /v1/reperer, /v1/lecture, /v1/provenance/registres,
    /v1/demo/entreprise, /preview/…, /exemples/*.json, /healthz, /openapi.json, /llms.txt unmetered
  limits: suggestions quota → 429
